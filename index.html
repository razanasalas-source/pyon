<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PYON · v3.9 · Calendario, CSV y presupuestos</title>
<style>
:root{--bg:#F4F5F1;--cd:#fff;--ink:#17231F;--mu:#5B6862;--ac:#1F6F5C;--on:#fff;--ln:#E3E6E0;--wb:#FFF1DC;--wt:#8A5200;--rd:#A63A28;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--cd:#1B2420;--ink:#E8EEEA;--mu:#A5B1AA;--ac:#4FB89F;--on:#0B1411;--ln:#2C3832;--wb:#3A2A12;--wt:#F0B35A;--rd:#E58673;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--cd:#1B2420;--ink:#E8EEEA;--mu:#A5B1AA;--ac:#4FB89F;--on:#0B1411;--ln:#2C3832;--wb:#3A2A12;--wt:#F0B35A;--rd:#E58673;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px 14px 100px}
.c{background:var(--cd);border-radius:14px;padding:14px;margin-bottom:10px}
.k{font-size:12px;color:var(--mu);letter-spacing:.04em;text-transform:uppercase}
.d{font-size:12px;color:var(--mu)}
.r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.big{font-size:34px;font-weight:700}
button,select,input{font:inherit;color:inherit}
input,select{width:100%;box-sizing:border-box;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:10px;min-height:44px}
input[type=checkbox]{width:20px;height:20px;min-height:0}
label{display:block;margin-top:8px;font-size:13px;color:var(--mu)}
label.chk{display:flex;gap:10px;align-items:center;min-height:44px;color:var(--wt);background:var(--wb);border-radius:10px;padding:0 12px}
.b{min-height:44px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:600;padding:0 16px}
.o{min-height:44px;border:1px solid var(--ln);border-radius:12px;background:transparent;padding:0 14px}
.ic{min-width:44px;font-size:22px;padding:0}
.row{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;margin-bottom:8px;padding:10px 14px;min-height:56px}
.seg{display:flex;border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin:8px 0}
.seg button{flex:1;min-height:44px;border:0;background:var(--cd)}
.seg .on{background:var(--ink);color:var(--cd)}
.t{height:10px;border-radius:5px;background:var(--ln)}
.f{height:10px;border-radius:5px;background:var(--ac)}
.w{background:var(--wb);color:var(--wt)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.m{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;font-size:13px;margin-top:8px}
.x{color:var(--rd);background:none;border:0;min-width:44px;min-height:44px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);padding:4px 0 env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;margin:0 auto}
nav button{flex:1;min-height:48px;background:none;border:0;color:var(--mu);font-size:13px;padding:0 2px}
nav .on{color:var(--ac);font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(100vh) rotate(540deg);opacity:0}}
.v>.c{animation:in .3s ease both}
.f{transform-origin:left;animation:gr .7s ease both}
svg[role=img]{animation:pop .5s ease both}
#toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cd);border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:12px;max-width:90%;z-index:5;animation:pop .25s ease}
#toast button{background:none;border:0;color:var(--cd);font-weight:700;text-decoration:underline;min-height:32px}
#fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:30px;box-shadow:0 4px 12px #0004;z-index:4}
.chip{display:inline-flex;align-items:center;margin:4px 6px 0 0}
.cf{position:fixed;top:-20px;font-size:22px;animation:fall 2.2s ease-in forwards;z-index:9;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}

/* PYON 3.5.1 — iOS / Safari responsive layout */
*,*::before,*::after{box-sizing:border-box}
html{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{width:100%;max-width:100%;overflow-x:hidden}
#app{width:100%;min-width:0;max-width:480px;margin-inline:auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
#app *,#app *::before,#app *::after{max-width:100%}
.c,.r,.seg,.m{min-width:0}
.r{flex-wrap:wrap;align-items:center}
.r>*,.seg>*,.m>*{min-width:0}
.r>span,.r>div,.r>label,.r>strong{overflow-wrap:anywhere}
button,input,select,textarea{max-width:100%;-webkit-appearance:none;appearance:none;border-radius:10px}
input,select,textarea{font-size:16px;min-width:0}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:checkbox}
input[type=radio]{-webkit-appearance:radio;appearance:radio}
button{white-space:normal;overflow-wrap:anywhere;touch-action:manipulation}
.seg{flex-wrap:wrap}
.seg button{min-width:0;flex:1 1 95px}
.m{grid-template-columns:minmax(0,96px) minmax(0,1fr) minmax(0,40px)}
nav{width:100%;max-width:100%;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav div{width:100%;min-width:0}
nav button{min-width:0;overflow-wrap:anywhere;font-size:clamp(10px,2.8vw,13px)}
#toast{width:max-content;max-width:calc(100vw - 24px);overflow-wrap:anywhere}
#lock{width:100%;max-width:100%;min-height:100dvh;overflow-y:auto}
.c img,.c svg,.c canvas{max-width:100%;height:auto}
.c table{max-width:100%;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:390px){#app{padding-left:10px;padding-right:10px}.c{padding:11px}.big{font-size:clamp(25px,7vw,34px)}.r>.b,.r>.o{flex-shrink:1}.m{grid-template-columns:minmax(0,82px) minmax(0,1fr) minmax(0,38px);gap:5px;font-size:12px}}

/* PYON 3.5.2 — ventanas combinadas y accesibles */
body.pyon-dialog-open{overflow:hidden}
#pyon-overlay{position:fixed;inset:0;z-index:30;background:rgba(8,20,16,.57);display:none;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
#pyon-overlay.open{display:flex}
#pyon-overlay.sheet{align-items:flex-end;padding:0}
.pyon-dialog{width:min(100%,420px);max-height:min(88dvh,720px);overflow:auto;overscroll-behavior:contain;background:var(--cd);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 18px 70px #0004}
.sheet .pyon-dialog{width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:90dvh}
.pyon-dialog h2{font-size:20px;margin:4px 0 8px}
.pyon-dialog p{margin:4px 0 14px;overflow-wrap:anywhere}
.pyon-dialog .pyon-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.pyon-dialog .pyon-actions button{flex:1 1 130px}
.pyon-dialog label{display:block}
.pyon-dialog .pyon-handle{width:40px;height:5px;background:var(--ln);border-radius:8px;margin:-8px auto 14px}
@media(prefers-reduced-motion:no-preference){#pyon-overlay.open .pyon-dialog{animation:in .2s ease-out}}

/* PYON v3.5.3 · Diseño equilibrado: jerarquía visual y lectura progresiva */
:root{--radius-card:18px}
#app{padding:12px 14px calc(100px + env(safe-area-inset-bottom,0px))}
.c{border-radius:var(--radius-card);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,44,32,.035)}
.k{font-size:11px;letter-spacing:.055em;font-weight:750}
.d{line-height:1.42}
.big{font-size:clamp(26px,7vw,34px);letter-spacing:-.04em;line-height:1.16}
.r{min-width:0;gap:10px}
.r>*{min-width:0}
button{cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pyon-hero{background:linear-gradient(135deg,#1f6f5c,#154b40);color:white;padding:18px;border-radius:20px;margin-bottom:12px}
.pyon-hero .k,.pyon-hero .d{color:#d9f1e9}
.pyon-hero .big{font-size:clamp(25px,7.5vw,36px);overflow-wrap:anywhere}
.pyon-mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.pyon-mini{padding:13px;border:1px solid var(--ln);background:var(--cd);border-radius:16px;min-width:0}
.pyon-mini .amount{font-weight:750;font-size:clamp(17px,4.8vw,22px);letter-spacing:-.035em;overflow-wrap:anywhere}
.pyon-mini .k{margin-bottom:7px}
.pyon-summary{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pyon-summary>*{min-width:0}
.pyon-detail{margin-top:9px}
.pyon-detail summary{cursor:pointer;color:var(--ac);font-size:12px;font-weight:700;padding:5px 0}
.pyon-detail p{margin:6px 0}
.pyon-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.pyon-menu button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;text-align:left;width:100%;min-height:91px;padding:13px;border:1px solid var(--ln);border-radius:15px;background:var(--cd);color:var(--ink);font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.pyon-menu .ico{font-size:23px;line-height:1.1}
.pyon-menu .txt{font-size:13px}
.pyon-menu button:active{transform:scale(.99)}
.pyon-section-title{font-weight:800;font-size:15px;margin:16px 2px 9px}
.pyon-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.pyon-shortcuts button{width:100%;min-height:46px}
.pyon-quiet{font-size:12px;color:var(--mu)}
.pyon-compact-card{padding:13px 15px}
.pyon-compact-card .r{flex-wrap:wrap}
.pyon-compact-card .d{overflow-wrap:anywhere}
@media(max-width:360px){#app{padding-left:10px;padding-right:10px}.pyon-menu button{padding:10px;min-height:84px}.pyon-mini{padding:11px}.pyon-shortcuts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.v>.c,.f,svg[role=img]{animation:none!important}}

/* PYON 3.5.4: temas y estilos, sin afectar la información financiera */
html:root[data-pyon-palette="emerald"]{--bg:#F4F9F6;--cd:#FFFFFF;--ink:#173B32;--mu:#58736A;--ac:#087F5B;--on:#FFFFFF;--ln:#DCEAE2;--wb:#FFF1DC;--wt:#8A5200;--rd:#B23C3C;color-scheme:light}
html:root[data-pyon-palette="executive"]{--bg:#F2F5FA;--cd:#FFFFFF;--ink:#142C4E;--mu:#64748B;--ac:#2563A6;--on:#FFFFFF;--ln:#DFE6F1;--wb:#FFF3D7;--wt:#815500;--rd:#B23C3C;color-scheme:light}
html:root[data-pyon-palette="aurora"]{--bg:#F8F5FF;--cd:#FFFFFF;--ink:#30234E;--mu:#706586;--ac:#6941C6;--on:#FFFFFF;--ln:#E8E0F8;--wb:#FFF1DC;--wt:#815500;--rd:#B23C3C;color-scheme:light}
html:root[data-pyon-palette="night"]{--bg:#101827;--cd:#1F2937;--ink:#F3F4F6;--mu:#BBC5D2;--ac:#34D399;--on:#101827;--ln:#394454;--wb:#47371D;--wt:#F4C46A;--rd:#FF9A8C;color-scheme:dark}
html[data-pyon-style="classic"] .c,html[data-pyon-style="classic"] .pyon-mini-card,html[data-pyon-style="classic"] .pyon-menu button,html[data-pyon-style="classic"] .pyon-dialog{border-radius:6px}
html[data-pyon-style="classic"] .pyon-menu{display:flex;flex-direction:column;gap:7px}
html[data-pyon-style="classic"] .pyon-menu button{display:flex;flex-direction:row;justify-content:flex-start;gap:12px;text-align:left}
html[data-pyon-style="classic"] .pyon-menu .ico{font-size:20px}
html[data-pyon-style="compact"] #app{padding:9px 10px 88px}
html[data-pyon-style="compact"] .c{padding:10px;margin-bottom:7px;border-radius:9px}
html[data-pyon-style="compact"] .pyon-menu{gap:6px}
html[data-pyon-style="compact"] .pyon-menu button{padding:8px 5px;border-radius:9px}
html[data-pyon-style="compact"] .pyon-section-title{margin-top:12px;margin-bottom:7px}
html[data-pyon-style="modern"] .c{border-radius:19px;box-shadow:0 3px 15px rgba(0,0,0,.035)}
html[data-pyon-style="modern"] .pyon-menu button{border-radius:17px}
.pyon-appearance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pyon-theme-choice{border:2px solid var(--ln);border-radius:15px;background:var(--cd);color:var(--ink);padding:12px;min-height:92px;text-align:left;cursor:pointer}
.pyon-theme-choice[aria-pressed="true"]{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 17%,transparent)}
.pyon-swatches{display:flex;gap:3px;margin-bottom:9px}
.pyon-swatches i{display:block;height:22px;flex:1;border-radius:5px;border:1px solid #7772}
.pyon-style-choice{display:flex;gap:10px;align-items:center;width:100%;padding:13px;margin:8px 0;text-align:left;border:1px solid var(--ln);border-radius:13px;background:var(--cd);color:var(--ink)}
.pyon-style-choice[aria-pressed="true"]{border:2px solid var(--ac)}
.pyon-preview{border:1px solid var(--ln);background:var(--bg);padding:14px;border-radius:16px;margin-top:12px}
.pyon-preview .c{margin:8px 0}
.pyon-preview .big{font-size:26px}
@media(max-width:360px){.pyon-appearance-grid{gap:6px}.pyon-theme-choice{padding:8px}}


/* v3.5.5: controles visibles de apariencia y precedencia de temas */
html:root[data-pyon-palette]{background:var(--bg)}
html[data-pyon-style="classic"] .c{box-shadow:none;border:1px solid var(--ln)}
html[data-pyon-style="classic"] .b,html[data-pyon-style="classic"] .o,html[data-pyon-style="classic"] input,html[data-pyon-style="classic"] select{border-radius:3px}
html[data-pyon-style="classic"] .pyon-menu{grid-template-columns:1fr}
html[data-pyon-style="classic"] .pyon-menu button{min-height:50px;padding:12px 15px}
html[data-pyon-style="compact"] .c{font-size:13px}
html[data-pyon-style="compact"] .r{gap:4px}
html[data-pyon-style="compact"] .pyon-menu{grid-template-columns:repeat(3,minmax(0,1fr))}
html[data-pyon-style="compact"] .pyon-menu .ico{font-size:19px}
html[data-pyon-style="compact"] .pyon-menu .txt{font-size:11px}
html[data-pyon-style="modern"] .c{border:1px solid color-mix(in srgb,var(--ln) 50%,transparent)}
html[data-pyon-palette="night"] .pyon-theme-choice,html[data-pyon-palette="night"] .pyon-style-choice{background:var(--cd)}

/* v3.5.6 - los cambios de tema son inmediatos; las gráficas siguen la paleta */
.pyon-theme-choice,.pyon-style-choice{transition:none!important}
.pyon-chart-modern{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;align-items:end;min-height:205px;padding-top:10px}
.pyon-chart-modern>div{min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:10px;color:var(--ink)}
.pyon-chart-modern b{font-size:11px;white-space:nowrap}
.pyon-chart-modern span{font-size:10px;overflow-wrap:anywhere}
.pyon-chart-column{height:145px;width:100%;display:flex;align-items:end;background:color-mix(in srgb,var(--ac) 9%,var(--cd));border-radius:11px;overflow:hidden}
.pyon-chart-column i{width:100%;display:block;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 70%,white),var(--ac));border-radius:10px 10px 0 0}
.pyon-chart-classic,.pyon-chart-compact{display:grid;gap:11px;margin:12px 0}
.pyon-chart-row{display:grid;grid-template-columns:90px minmax(0,1fr) 60px;gap:8px;align-items:center;font-size:12px}
.pyon-chart-row b,.pyon-chart-compact b{text-align:right;font-size:12px}
.pyon-chart-track{height:17px;background:var(--ln);overflow:hidden;border-radius:2px}
.pyon-chart-track i{display:block;height:100%;background:var(--ac);border-radius:2px}
.pyon-chart-compact{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pyon-chart-compact>div{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:8px;display:grid;gap:5px;font-size:11px}
.pyon-chart-compact .pyon-chart-track{height:8px;border-radius:8px}
.pyon-chart-compact .pyon-chart-track i{border-radius:8px}
@media(max-width:350px){.pyon-chart-row{grid-template-columns:72px minmax(0,1fr) 52px;gap:4px;font-size:11px}.pyon-chart-modern{gap:4px}}

/* PYON v3.7 — sistema visual compartido */
:root{--shadow-soft:0 8px 28px rgba(13,39,31,.055)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.48}
#app{max-width:520px}
.c{border:1px solid var(--ln);box-shadow:var(--shadow-soft)}
.pyon-section-title{font-weight:800;letter-spacing:-.02em}
.pyon-hero{background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 75%,#142c4e));color:var(--on);padding:20px;border-radius:23px;margin-bottom:14px;box-shadow:0 12px 28px color-mix(in srgb,var(--ac) 22%,transparent)}
.pyon-hero .k,.pyon-hero .d{color:var(--on);opacity:.88}
.pyon-hero .big{font-size:clamp(25px,7vw,35px);letter-spacing:-.05em}
.pyon-hero .pyon-hero-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.pyon-hero .pyon-hero-metric{padding:11px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:13px}
.pyon-hero .pyon-hero-metric b{display:block;font-size:17px;margin-top:3px;overflow-wrap:anywhere}
.pyon-report-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pyon-report-title h3{margin:0;font-size:16px;letter-spacing:-.02em}
.pyon-report-chip{font-size:11px;padding:5px 8px;border-radius:20px;background:var(--bg);color:var(--mu)}
.pyon-legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:10px}
.pyon-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--ac)}
.pyon-legend .out i{background:var(--rd)}
.pyon-year-svg{width:100%;height:auto;overflow:visible}
.pyon-year-svg text{font-family:inherit;fill:var(--mu);font-size:10px}
.pyon-year-svg .in{fill:var(--ac)}
.pyon-year-svg .out{fill:var(--rd)}
.pyon-year-svg .gridline{stroke:var(--ln);stroke-dasharray:3 4}
.pyon-year-svg rect{transition:opacity .18s}
.pyon-year-svg rect:hover{opacity:.72}
.pyon-category-row{padding:10px 0;border-bottom:1px solid var(--ln)}
.pyon-category-row:last-child{border:0}
.pyon-category-row .r{margin-bottom:7px}
.pyon-category-row .t{height:12px;border-radius:12px;background:var(--ln);overflow:hidden}
.pyon-category-row .f{height:100%;border-radius:12px;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#fff))}
.pyon-chart-modern .pyon-chart-column{background:color-mix(in srgb,var(--ac) 10%,var(--cd))}
.pyon-chart-modern .pyon-chart-column i{background:var(--ac)}
html[data-pyon-style="classic"] .pyon-hero{border-radius:4px;box-shadow:none;background:var(--cd);color:var(--ink);border:2px solid var(--ac)}
html[data-pyon-style="classic"] .pyon-hero .k,html[data-pyon-style="classic"] .pyon-hero .d{color:var(--mu)}
html[data-pyon-style="classic"] .pyon-hero .pyon-hero-metric{background:var(--bg);border:1px solid var(--ln)}

html[data-pyon-style="classic"] .pyon-category-row .t,html[data-pyon-style="classic"] .pyon-category-row .f{border-radius:1px}

async function pinOn(){const a=val('p1'),b=val('p2');if(!/^\d{4,6}$/.test(a)){msg='El PIN debe tener de 4 a 6 números.';return render()}if(a!==b){msg='Los PIN no coinciden.';return render()}const s=nid();C.pin={s,h:await sha(s+a)};save('cfg');toast('Bloqueo activado 🔒');render()}

function debtPaid(d){return (d.pagos||[]).reduce((a,p)=>a+(+p.mo||0),0)}

ass="o" data-a="debtlegacy" data-v="${d.id}">Reabrir registro antiguo</button>`:''}<button class="x" data-a="dd" data-v="${d.id}" aria-label="Eliminar deuda">✕</button></div></div>`};const A=C.deudas.filter(d=>!['done','legacy'].includes(debtState(d))),B=C.deudas.filter(d=>['done','legacy'].includes(debtState(d)));return `<div class="c"><div class="k">Nueva deuda</div><div class="seg" style="margin-bottom:0"><button class="${fD==='c'?'on':''}" data-a="td" data-v="c">Me deben</button><button class="${fD==='p'?'on':''}" data-a="td" data-v="p">Debo</button></div><label>Persona o entidad<input id="dn"></label><label>Monto<input id="dm" type="number" inputmode="decimal" step="0.01" min="0"></label><label>Moneda<select id="dc"><option value="PEN">S/ Soles</option><option value="USD">US$ Dólares</option></select></label><label>Vence (opcional)<input id="dv" type="date"></label><button class="b" data-a="addd" style="width:100%;margin-top:12px">Agregar</button></div>`+(A.length?A.map(f).join(''):'<div class="c d">Sin deudas pendientes.</div>')+(B.length?`<div class="k" style="margin:10px 0 6px">Saldadas</div>`+B.map(f).join(''):'')}
let fD='c';
function goalSaved(id){return goalContributions(id).reduce((v,x)=>v+(x.t==='a_return'?-1:1)*(+x.mo||0),0)}

function vAhor(){
 const cards=['PEN','USD'].map(cur=>`<div class="c"><div class="k">Aportes registrados · ${cur}</div><b style="font-size:22px;color:var(--ac)">${money(C.metas.filter(m=>(m.cur||'PEN')===cur).reduce((v,m)=>v+goalSaved(m.id),0),cur)}</b></div>`).join('');
 const goals=C.metas.map(m=>{const cur=m.cur||'PEN',saved=goalSaved(m.id),pct=m.meta>0?Math.min(100,Math.round(saved/m.meta*100)):0,accounts=C.medios.filter(a=>!a.x&&a.k!=='c'&&(a.cur||'PEN')===cur),contrib=goalContributions(m.id).slice().sort((a,b)=>b.f.localeCompare(a.f));
 return `<div class="c"><div class="r"><b>🎯 ${esc(m.n)}</b><span class="d">${cur}${m.fe?' · '+esc(m.fe):''}</span></div><div class="r"><b>${money(saved,cur)}</b><span class="d">Meta: ${money(m.meta,cur)}</span></div><div class="t" role="progressbar" aria-label="Avance ${esc(m.n)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="f" style="width:${pct}%"></div></div><div class="d">${pct}% completado · Faltan ${money(Math.max(0,m.meta-saved),cur)}</div><div style="margin-top:12px"><label>Aporte (${cur})<input id="ap${m.id}" type="number" min="0.01" step="0.01" placeholder="Importe del aporte"></label><label>¿De qué cuenta sale?<select id="amac${m.id}"><option value="">Selecciona una cuenta</option>${accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.n)} · ${cur}</option>`).join('')}</select></label><button class="b" data-a="ap" data-v="${m.id}" ${accounts.length?'':'disabled'}>Registrar aporte</button></div><details style="margin-top:12px"><summary>↩️ Retirar dinero reservado</summary><p class="d">Libera dinero de esta meta y devuélvelo al saldo disponible estimado de una cuenta. No realiza transferencias bancarias.</p><label>Importe (${cur})<input id="ret${m.id}" type="number" min="0.01" step="0.01" placeholder="Máximo ${saved.toFixed(2)}"></label><label>Cuenta que recupera el disponible<select id="retac${m.id}"><option value="">Selecciona una cuenta</option>${accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.n)} · ${cur}</option>`).join('')}</select></label><button class="o" data-a="retg" data-v="${m.id}" ${saved>0&&accounts.length?'':'disabled'}>Confirmar retiro de la reserva</button></details><details style="margin-top:12px"><summary>📋 Historial de aportes (${contrib.length})</summary>${contrib.length?contrib.map(x=>`<div class="r" style="padding:7px 0;border-top:1px solid var(--ln)"><span class="d">${esc(x.f)} · ${esc(med(x.cuentaId||x.m)?.n||'Aporte antiguo sin cuenta')}</span><b style="color:${x.t==='a_return'?'var(--rd)':'var(--ac)'}">${x.t==='a_return'?'− ':'+ '}${money(x.mo,cur)}</b></div>`).join(''):'<p class="d">Sin aportes todavía.</p>'}</details></div>`}).join('');
 return cards+goals+`<div class="c"><div class="k">➕ Nueva meta de ahorro</div><label>Nombre<input id="gn" placeholder="Ej. Viaje, emergencia"></label><label>Moneda<select id="gcur"><option value="PEN">Soles (PEN)</option><option value="USD">Dólares (USD)</option></select></label><label>Importe objetivo<input id="gm" type="number" min="0.01" step="0.01"></label><label>Fecha objetivo (opcional)<input id="gf" type="month"></label><button class="b" data-a="addg">Crear meta</button></div><div class="c d">💡 Los aportes vinculados a una cuenta reducen su saldo disponible estimado. Los retiros de la reserva devuelven ese disponible. Se muestran como dinero reservado para la meta, no como gasto ordinario. Las metas y aportes anteriores se conservan; si un aporte antiguo no tiene cuenta, se identifica en el historial.</div>`;
}
function vMed(){const e=medEd?C.medios.find(m=>m.id===medEd):null;return back()+`<div class="c"><div class="k">${e?'Editar cuenta':'Agregar cuenta o medio de pago'}</div><label>Nombre<input id="bn" list="bl" placeholder="Ej. BCP ahorro dólares" value="${e?esc(e.n):''}"></label><datalist id="bl">${BANCOS.map(b=>`<option value="${esc(b)}">`).join('')}</datalist><label>Tipo<select id="bk"><option value="d"${e&&e.k==='d'?' selected':''}>Cuenta de débito</option><option value="c"${e&&e.k==='c'?' selected':''}>Tarjeta de crédito</option><option value="b"${e&&e.k==='b'?' selected':''}>Billetera (Yape, Plin)</option><option value="e"${e&&e.k==='e'?' selected':''}>Efectivo</option></select></label><label>Moneda de la cuenta<select id="bcur"${e&&accountMovements(e.id).length?' disabled':''}><option value="PEN"${!e||e.cur!=='USD'?' selected':''}>Soles (PEN)</option><option value="USD"${e&&e.cur==='USD'?' selected':''}>Dólares (USD)</option></select></label>${e&&accountMovements(e.id).length?'<div class="d">La moneda está bloqueada porque esta cuenta ya tiene movimientos. Así evitamos mezclar soles y dólares en su historial.</div>':''}<label>Saldo inicial (opcional)<input id="bsi" type="number" inputmode="decimal" step="0.01" placeholder="Lo completaremos después" value="${e&&e.saldoInicial!==null&&e.saldoInicial!==undefined?e.saldoInicial:''}"></label><label>Día de cierre (solo crédito)<input id="bc" type="number" min="1" max="31" inputmode="numeric" value="${e?esc(e.cie||''):''}"></label><label>Día de pago (solo crédito)<input id="bp" type="number" min="1" max="31" inputmode="numeric" value="${e?esc(e.pag||''):''}"></label><div class="r" style="margin-top:12px"><button class="b" data-a="${e?'medsave':'addm'}" style="flex:1">${e?'Guardar cambios':'Agregar cuenta'}</button>${e?'<button class="o" data-a="medcancel">Cancelar</button>':''}</div></div><div class="c"><div class="k">Mis cuentas y medios de pago</div>`+(C.medios.length?C.medios.map(m=>`<div style="border-top:1px solid var(--ln);padding:10px 0"><div class="r"><div><b>${esc(m.n)}</b><div class="d">${KN[m.k]||'cuenta'} · ${m.cur||'PEN'}${m.saldoInicial!==null&&m.saldoInicial!==undefined?' · saldo inicial '+(m.cur==='USD'?'US$ ':'S/ ')+Number(m.saldoInicial).toFixed(2):' · saldo inicial pendiente'}${m.k==='c'?' · cierre '+esc(m.cie||'—')+' · pago '+esc(m.pag||'—'):''}${m.x?' · archivada':''}</div></div><span style="display:flex;gap:4px"><button class="o" data-a="mededit" data-v="${m.id}" aria-label="Editar ${esc(m.n)}">✎</button><button class="o" data-a="xm" data-v="${m.id}">${m.x?'Reactivar':'Archivar'}</button></span></div></div>`).join(''):'<div class="d">Aún no agregaste ninguno.</div>')+`<div class="d" style="margin-top:8px">Puedes cambiar el nombre, tipo y saldo inicial. La moneda queda bloqueada cuando existen movimientos para evitar mezclar monedas. Archivar no elimina el historial.</div></div>`}

function aiTrend(cur){
 const periods=[];let [y,m]=ym.split('-').map(Number);
 for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const r=all().filter(x=>x.f&&x.f.slice(0,7)===key&&reportCur(x)===cur);periods.push({key,inc:r.filter(x=>x.t==='i').reduce((a,x)=>a+(Number(x.mo)||0),0),exp:r.filter(x=>x.t==='g').reduce((a,x)=>a+(Number(x.mo)||0),0),n:r.filter(x=>x.t==='i'||x.t==='g').length})}
 const observed=periods.filter(x=>x.n>0),total=observed.reduce((a,x)=>a+x.exp,0),avg=observed.length?total/observed.length:0;
 const max=Math.max(1,...periods.map(x=>Math.max(x.exp,x.inc)));
 return `<div class="c"><div class="k">📈 Tendencia de los últimos seis meses · ${cur}</div><p class="d">Cada barra representa los ingresos y gastos registrados; los meses vacíos no equivalen a gasto cero confirmado.</p>${periods.map(x=>`<div style="margin:11px 0"><div class="r"><b>${esc(x.key)}</b><span class="d">${x.n} movimientos</span></div><div style="margin:4px 0;background:var(--ln);height:8px;border-radius:5px"><div style="background:#23846c;width:${(100*x.inc/max).toFixed(1)}%;height:8px;border-radius:5px"></div></div><div style="background:var(--ln);height:8px;border-radius:5px"><div style="background:#bb7825;width:${(100*x.exp/max).toFixed(1)}%;height:8px;border-radius:5px"></div></div><div class="d">Ingresos ${money(x.inc,cur)} · Gastos ${money(x.exp,cur)}</div></div>`).join('')}<div class="d">🟢 Ingresos · 🟠 Gastos</div><p><b>Promedio de gastos en meses con registros:</b> ${observed.length?money(avg,cur):'No disponible'}</p><p class="d">Se utilizaron ${observed.length} de 6 meses con al menos un ingreso o gasto registrado. Este promedio puede estar sesgado si faltan movimientos.</p></div>`;
}


function aiScenario(cur){
 const rows=[];let [y,m]=ym.split('-').map(Number);
 for(let i=0;i<6;i++){const d=new Date(y,m-1-i,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const a=all().filter(x=>x.f&&x.f.slice(0,7)===key&&reportCur(x)===cur&&(x.t==='i'||x.t==='g'));if(a.length)rows.push({key,exp:a.filter(x=>x.t==='g').reduce((s,x)=>s+(Number(x.mo)||0),0),inc:a.filter(x=>x.t==='i').reduce((s,x)=>s+(Number(x.mo)||0),0)})}
 const pct=Math.min(50,Math.max(0,Number(window.aiCutPercent)||10));const months=Math.min(12,Math.max(1,Number(window.aiMonths)||6));const avgExp=rows.length?rows.reduce((s,x)=>s+x.exp,0)/rows.length:0;const avgInc=rows.length?rows.reduce((s,x)=>s+x.inc,0)/rows.length:0;const monthly=avgExp*pct/100;
 return `<div class="c"><div class="k">🎯 Simulador de ahorro · ${cur}</div><p class="d">Escenario hipotético: ¿qué pasaría si reduces tus gastos registrados en un porcentaje? No es una predicción de tus finanzas futuras.</p><label>Reducción de gastos<select id="aicut">${[5,10,15,20,25,30,40,50].map(v=>`<option value="${v}" ${v===pct?'selected':''}>${v}%</option>`).join('')}</select></label><label>Horizonte<select id="aimonths">${[3,6,9,12].map(v=>`<option value="${v}" ${v===months?'selected':''}>${v} meses</option>`).join('')}</select></label>${rows.length?`<div class="r"><span>Gasto mensual de referencia</span><b>${money(avgExp,cur)}</b></div><div class="r"><span>Reducción mensual simulada</span><b>${money(monthly,cur)}</b></div><div class="r"><span>Ahorro hipotético en ${months} meses</span><b>${money(monthly*months,cur)}</b></div><div class="r"><span>Resultado mensual estimado del escenario</span><b>${money(avgInc-avgExp+monthly,cur)}</b></div><p class="d">Referencia: ${rows.length} mes(es) con registros entre los últimos seis meses. Se supone que ingresos y gastos permanecen constantes, que todos los gastos son reducibles y que se mantiene el recorte cada mes. No incluye intereses, inflación, cambios de moneda ni gastos imprevistos.</p>`:'<p class="d">No hay movimientos suficientes para calcular una referencia. Registra ingresos o gastos primero.</p>'}</div>`;
}

function aiHealth(cur){
 const months=[];const [yy,mm]=ym.split('-').map(Number);
 for(let i=0;i<6;i++){const d=new Date(yy,mm-1-i,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const rows=all().filter(x=>x.f&&x.f.slice(0,7)===key&&reportCur(x)===cur&&(x.t==='i'||x.t==='g'));if(rows.length)months.push({key,n:rows.length,inc:rows.filter(x=>x.t==='i').reduce((s,x)=>s+(Number(x.mo)||0),0),exp:rows.filter(x=>x.t==='g').reduce((s,x)=>s+(Number(x.mo)||0),0)});}
 const totalI=months.reduce((s,x)=>s+x.inc,0),totalE=months.reduce((s,x)=>s+x.exp,0),net=totalI-totalE,ratio=totalI>0?100*net/totalI:null;
 const current=all().filter(x=>x.f&&x.f.slice(0,7)===ym&&reportCur(x)===cur&&x.t==='g');
 const rec=current.filter(x=>x.rid),recSum=rec.reduce((s,x)=>s+(Number(x.mo)||0),0),monthExp=current.reduce((s,x)=>s+(Number(x.mo)||0),0);
 const warn=[];
 if(months.length<3)warn.push('Hay menos de tres meses con movimientos. Este diagnóstico es preliminar.');
 if(totalI===0)warn.push('No hay ingresos registrados en los meses observados; no es posible calcular la tasa de ahorro.');
 if(totalI>0&&net<0)warn.push('Los gastos registrados superan a los ingresos del periodo. Revisa si hay movimientos faltantes y cuáles gastos pueden ajustarse.');
 if(months.some(x=>x.inc>0&&x.exp>x.inc))warn.push('Hay meses con gastos superiores a los ingresos registrados.');
 if(!rec.length)warn.push('No hay gastos del mes identificados como recurrentes mediante su vínculo con una recurrencia; esto no significa que no existan gastos fijos.');
 const cls=ratio===null?'No calculable':ratio<0?'Flujo negativo':ratio<10?'Margen reducido':ratio<20?'Margen positivo':'Margen amplio';
 return `<div class="c"><div class="k">🩺 Diagnóstico financiero · ${cur}</div><p class="d">Resumen descriptivo de los últimos seis meses, utilizando únicamente los meses con movimientos. No es una calificación crediticia ni un diagnóstico profesional.</p>
 <div class="r"><span>Meses con registros</span><b>${months.length} de 6</b></div><div class="r"><span>Ingresos registrados</span><b>${money(totalI,cur)}</b></div><div class="r"><span>Gastos registrados</span><b>${money(totalE,cur)}</b></div><div class="r"><span>Resultado acumulado</span><b>${money(net,cur)}</b></div><div class="r"><span>Margen sobre ingresos</span><b>${ratio===null?'No disponible':ratio.toFixed(1)+'%'}</b></div><p class="d">Lectura del margen: <b>${cls}</b>. Se calcula (ingresos − gastos) / ingresos × 100. No equivale al saldo de una cuenta ni al dinero realmente ahorrado.</p>
 <div class="r"><span>Gastos recurrentes identificados en ${esc(ym)}</span><b>${money(recSum,cur)}</b></div><p class="d">${rec.length} movimiento(s) vinculados a gastos recurrentes; ${monthExp>0?(recSum/monthExp*100).toFixed(1)+'% de los gastos registrados del mes':'sin proporción calculable este mes'}. Los pagos periódicos registrados manualmente pueden no estar identificados.</p>
 <div class="k" style="margin-top:15px">🚦 Alertas y calidad de datos</div>${warn.length?warn.map(w=>`<p style="border-top:1px solid var(--ln);padding-top:9px">⚠️ ${esc(w)}</p>`).join(''):'<p>ℹ️ No se detectaron estas alertas en los datos disponibles. Esto no garantiza que todos los movimientos estén completos.</p>'}
 <p class="d">Se excluyen transferencias, cambios de moneda, aportes a metas y pagos de deudas del cálculo de ingresos/gastos ordinarios. PEN y USD se analizan por separado.</p></div>`;
}

function vPyonIA(){
 const cur=window.aiCurrency==='USD'?'USD':'PEN';
 const current=ym,previous=prevYm();
 const rows=(month)=>all().filter(x=>x.f&&x.f.slice(0,7)===month&&reportCur(x)===cur);
 const now=rows(current),prev=rows(previous);
 const sumT=(arr,t)=>arr.filter(x=>x.t===t).reduce((v,x)=>v+(Number(x.mo)||0),0);
 const expense=sumT(now,'g'),income=sumT(now,'i'),lastExpense=sumT(prev,'g');
 const categories={};now.filter(x=>x.t==='g').forEach(x=>{const k=x.c||'Otros';categories[k]=(categories[k]||0)+(Number(x.mo)||0)});
 const ranking=Object.entries(categories).sort((a,b)=>b[1]-a[1]);
 const findings=[];
 if(!now.length)findings.push(['ℹ️','Aún no hay registros este mes','Registra movimientos para que PYON IA pueda analizar este periodo.','Datos insuficientes']);
 else{
  if(expense>0&&ranking.length){const [name,value]=ranking[0];findings.push(['🔎','Tu principal categoría de gasto es '+name,`Representa ${Math.round(value/expense*100)}% de los gastos de ${current} (${money(value,cur)}).`,'Dato calculado']);}
  if(lastExpense>0){const delta=(expense-lastExpense)/lastExpense*100;findings.push([delta>10?'⚠️':'📉',delta>10?'Tus gastos aumentaron':'Comparación con el mes anterior',`Gastaste ${Math.abs(delta).toFixed(1)}% ${delta>=0?'más':'menos'} que en ${previous}. Compara también la cantidad de movimientos registrados en ambos meses.`,'Dato calculado']);}
  else findings.push(['ℹ️','Comparación mensual no disponible','No hay gastos del mes anterior en esta moneda; evitamos calcular porcentajes engañosos.','Datos insuficientes']);
  const limits=ranking.map(([cat,value])=>({cat,value,limit:budgetLimit(cat,cur)})).filter(x=>x.limit>0&&x.value/x.limit>=.8).sort((a,b)=>b.value/b.limit-a.value/a.limit);
  for(const item of limits.slice(0,2))findings.push(['🚦','Presupuesto: '+item.cat,`Has utilizado ${Math.round(item.value/item.limit*100)}% de tu límite (${money(item.value,cur)} de ${money(item.limit,cur)}).`,'Alerta basada en datos']);
  if(income>0&&expense>income)findings.push(['⚠️','Gastos superiores a ingresos',`En ${current} tus gastos superan los ingresos registrados por ${money(expense-income,cur)}. Verifica que tus registros estén completos.`,'Alerta basada en datos']);
  if(ranking.length&&expense>0)findings.push(['💡','Oportunidad de revisión',`Revisa los gastos de ${ranking[0][0]}. Reducirlos un 10% equivaldría a ${money(ranking[0][1]*.1,cur)} en este mes, suponiendo que sean reducibles.`,'Simulación, no predicción']);
 }
 const cards=[['Ingresos del mes',income],['Gastos del mes',expense],['Resultado del mes',income-expense]];
 return back()+`<div class="c" style="background:linear-gradient(125deg,#e5f8ef,#edf3ff);color:#183b33"><div style="font-size:30px">🐰✨</div><h2 style="margin:5px 0">PYON IA · Tu panel financiero</h2><p style="margin:5px 0">Análisis privado de tus registros, sin enviar información a servicios de IA externos.</p><span class="d">Versión inicial: reglas y cálculos explicables, no un modelo generativo.</span></div>`+
 `<div class="c"><label>Moneda del análisis<select id="aicur"><option value="PEN" ${cur==='PEN'?'selected':''}>Soles (PEN)</option><option value="USD" ${cur==='USD'?'selected':''}>Dólares (USD)</option></select></label><div class="d">Periodo: ${current}. Para cambiarlo utiliza las flechas del mes en Inicio.</div></div>`+
 cards.map(([name,v])=>`<div class="c"><div class="k">${name} · ${cur}</div><b style="font-size:23px">${money(v,cur)}</b></div>`).join('')+
 `<div class="c"><div class="k">🔔 Hallazgos y recomendaciones</div>${findings.map(([icon,title,desc,kind])=>`<div style="border-top:1px solid var(--ln);padding:12px 0"><div class="r"><b>${icon} ${esc(title)}</b></div><p style="margin:5px 0;line-height:1.5">${esc(desc)}</p><span class="d">${esc(kind)}</span></div>`).join('')}</div>`+
 `<div class="c"><div class="k">📊 Distribución de gastos</div>${ranking.length?ranking.slice(0,6).map(([name,value])=>`<div style="margin:10px 0"><div class="r"><span>${esc(name)}</span><b>${money(value,cur)}</b></div><div class="t"><div class="f" style="width:${expense?Math.min(100,100*value/expense):0}%"></div></div></div>`).join(''):'<p class="d">No hay gastos para representar.</p>'}</div>`+
 aiHealth(cur)+aiTrend(cur)+aiScenario(cur)+
 `<div class="c d">🔒 Privacidad: el análisis se realiza en tu navegador. PYON IA no accede a bancos, no ejecuta transferencias y no utiliza información que no esté registrada. Los saldos pueden ser incompletos si faltan movimientos o saldos iniciales. Los consejos no son asesoría financiera profesional.</div>`;
}

 else if(a==='addd'){const n=val('dn'),mo=+val('dm');if(!n||!(mo>0)){msg='Escribe el nombre y un monto mayor que cero.';return render()}C.deudas.push({id:nid(),dir:fD,n,mo,v:val('dv'),cur:val('dc')==='USD'?'USD':'PEN'});save('cfg')}
 else if(a==='debtpay'){const d=C.deudas.find(x=>x.id===v);if(d){const amount=+val('debtamount'+v),m=med(val('debtaccount'+v)),date=val('debtdate'+v)||today(),left=debtLeft(d);if(!m||m.x||m.k==='c'||(m.cur||'PEN')!==(d.cur||'PEN')||!(amount>0)||amount>left+0.001){msg='Comprueba el importe y selecciona una cuenta activa de la misma moneda (no tarjeta de crédito).';return render()}const paymentId=nid(),movementId=nid();d.pagos=d.pagos||[];d.pagos.push({id:paymentId,mo:Math.round(amount*100)/100,m:m.id,f:date,movementId});d.ok=debtLeft(d)<0.005?1:0;addMov({id:movementId,t:d.dir==='c'?'debt_in':'debt_out',f:date,mo:Math.round(amount*100)/100,m:m.id,cuentaId:m.id,cur:d.cur||'PEN',deudaId:d.id,pagoId:paymentId,n:(d.dir==='c'?'Cobro de deuda: ':'Pago de deuda: ')+d.n});save('cfg');toast('Abono registrado ✓')}}
 else if(a==='debtundo'){const d=C.deudas.find(x=>x.id===v),pay=d?.pagos?.find(p=>p.id===b.dataset.p);if(d&&pay){if(!await pyonConfirm('¿Anular este pago y revertir el movimiento de la cuenta?','Anular abono'))return;d.pagos=d.pagos.filter(p=>p.id!==pay.id);for(const y in M){const before=M[y].length;M[y]=M[y].filter(x=>x.id!==pay.movementId);if(M[y].length!==before)save(y)}d.ok=0;save('cfg');toast('Pago anulado y saldo corregido')}}
 else if(a==='debtlegacy'){const d=C.deudas.find(x=>x.id===v);if(d){d.ok=0;save('cfg')}}
 else if(a==='dd'){const d=C.deudas.find(x=>x.id===v);if(d){if((d.pagos||[]).length){msg='Primero anula los pagos registrados en el historial antes de eliminar esta deuda.';return render()}if(await pyonConfirm('¿Eliminar esta deuda? Esta acción no se puede deshacer.','Eliminar deuda')){C.deudas=C.deudas.filter(x=>x.id!==v);save('cfg')}}}
 else if(a==='addg'){const n=val('gn'),meta=+val('gm');if(!n||!(meta>0)){msg='Escribe el nombre y el monto de la meta.';return render()}C.metas.push({id:nid(),n,meta,cur:val('gcur')==='USD'?'USD':'PEN',fe:val('gf')});save('cfg')}
 else if(a==='ap'){const mo=+val('ap'+v);if(!(mo>0)){msg='Escribe el monto a aportar.';return render()}const mt=C.metas.find(x=>x.id===v),acct=med(val('amac'+v));if(!mt||!acct||acct.x||acct.k==='c'||(acct.cur||'PEN')!==(mt.cur||'PEN')){msg='Selecciona una cuenta activa de la misma moneda que la meta.';return render()}const pre=goalSaved(v);addMov({t:'a',f:today(),mo,a:v,m:acct.id,cuentaId:acct.id,cur:mt.cur||'PEN'});ym=today().slice(0,7);msg='Aporte registrado y descontado del saldo.';if(mt&&mt.meta>0&&pre<mt.meta&&pre+mo>=mt.meta){confeti();msg='🎉 ¡Meta alcanzada: '+mt.n+'!'}}
 else if(a==='retg'){const mt=C.metas.find(x=>x.id===v),mo=+val('ret'+v),acct=med(val('retac'+v));if(!mt||!Number.isFinite(mo)||mo<=0||mo>goalSaved(v)+0.001||!acct||acct.x||acct.k==='c'||(acct.cur||'PEN')!==(mt.cur||'PEN')){msg='Comprueba el importe pendiente en la meta y selecciona una cuenta activa de la misma moneda.';return render()}if(!await pyonConfirm('¿Liberar '+money(mo,mt.cur||'PEN')+' de esta meta hacia '+acct.n+'? Solo cambia el registro interno de PYON.','Retirar de la meta'))return;addMov({t:'a_return',f:today(),mo:Math.round(mo*100)/100,a:v,m:acct.id,cuentaId:acct.id,cur:mt.cur||'PEN',n:'Retiro de reserva: '+mt.n});msg='Dinero liberado de la meta y devuelto al disponible estimado.'}
 else if(a==='mededit'){medEd=v;sub='med'}
 else if(a==='medcancel'){medEd=null;sub='med'}
 else if(a==='medsave'){const m=C.medios.find(x=>x.id===medEd),n=val('bn'),k=val('bk');if(!m||!n){msg='Escribe el nombre de la cuenta.';return render()}if(accountMovements(m.id).length&&val('bcur')!==(m.cur||'PEN')){msg='No se puede cambiar la moneda porque la cuenta ya tiene movimientos.';return render()}if(/^(yape|plin)$/i.test(n))k='b';if(/^efectivo$/i.test(n))k='e';m.n=n;m.k=k;m.cur=val('bcur')==='USD'?'USD':'PEN';m.saldoInicial=val('bsi')!==''?+val('bsi'):null;m.tipoCuenta=k;m.cie=k==='c'?val('bc'):' ';m.pag=k==='c'?val('bp'):' ';medEd=null;save('cfg');msg='Cuenta actualizada. Los movimientos históricos se conservaron.'}
 else if(a==='addm'){let n=val('bn'),k=val('bk');if(!n){msg='Escribe el nombre.';return render()}if(/^(yape|plin)$/i.test(n))k='b';if(/^efectivo$/i.test(n))k='e';C.medios.push({id:nid(),n,k,cur:val('bcur')==='USD'?'USD':'PEN',saldoInicial:val('bsi')!==''?+val('bsi'):null,tipoCuenta:k,cie:k==='c'?val('bc'):'',pag:k==='c'?val('bp'):''});save('cfg');msg='Medio de pago agregado.'}
 else if(a==='xm'){const m=med(v);if(m){m.x=m.x?0:1;save('cfg')}}
 else if(a==='addc'){const n=val('cn');if(!n){msg='Escribe el nombre.';return render()}if(!C.cats.some(c=>c.n.toLowerCase()===n.toLowerCase()))C.cats.push({n});save('cfg')}
 else if(a==='xc'){const c=C.cats[+v];if(c){c.x=c.x?0:1;save('cfg')}}
 render()});
let hid=0;document.addEventListener('visibilitychange',async()=>{if(document.hidden){hid=Date.now();return}if(C.pin&&hid&&Date.now()-hid>60000)lock();if(!pend.size&&db){await load();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lp')unlock()});
init();
