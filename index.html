<style>
:root{--bg:#F4F5F1;--cd:#fff;--ink:#17231F;--mu:#5B6862;--ac:#1F6F5C;--on:#fff;--ln:#E3E6E0;--wb:#FFF1DC;--wt:#8A5200;--rd:#A63A28;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--cd:#1B2420;--ink:#E8EEEA;--mu:#A5B1AA;--ac:#4FB89F;--on:#0B1411;--ln:#2C3832;--wb:#3A2A12;--wt:#F0B35A;--rd:#E58673;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--cd:#1B2420;--ink:#E8EEEA;--mu:#A5B1AA;--ac:#4FB89F;--on:#0B1411;--ln:#2C3832;--wb:#3A2A12;--wt:#F0B35A;--rd:#E58673;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px 14px 100px}
.c{background:var(--cd);border-radius:14px;padding:14px;margin-bottom:10px}
.k{font-size:12px;color:var(--mu);letter-spacing:.04em;text-transform:uppercase}
.d{font-size:12px;color:var(--mu)}
.r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.big{font-size:34px;font-weight:700}
button,select,input{font:inherit;color:inherit}
input,select{width:100%;box-sizing:border-box;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:10px;min-height:44px}
input[type=checkbox]{width:20px;height:20px;min-height:0}
label{display:block;margin-top:8px;font-size:13px;color:var(--mu)}
label.chk{display:flex;gap:10px;align-items:center;min-height:44px;color:var(--wt);background:var(--wb);border-radius:10px;padding:0 12px}
.b{min-height:44px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:600;padding:0 16px}
.o{min-height:44px;border:1px solid var(--ln);border-radius:12px;background:transparent;padding:0 14px}
.ic{min-width:44px;font-size:22px;padding:0}
.row{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;margin-bottom:8px;padding:10px 14px;min-height:56px}
.seg{display:flex;border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin:8px 0}
.seg button{flex:1;min-height:44px;border:0;background:var(--cd)}
.seg .on{background:var(--ink);color:var(--cd)}
.t{height:10px;border-radius:5px;background:var(--ln)}
.f{height:10px;border-radius:5px;background:var(--ac)}
.w{background:var(--wb);color:var(--wt)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.m{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;font-size:13px;margin-top:8px}
.x{color:var(--rd);background:none;border:0;min-width:44px;min-height:44px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);padding:4px 0 env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;margin:0 auto}
nav button{flex:1;min-height:48px;background:none;border:0;color:var(--mu);font-size:13px;padding:0 2px}
nav .on{color:var(--ac);font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(100vh) rotate(540deg);opacity:0}}
.v>.c{animation:in .3s ease both}
.f{transform-origin:left;animation:gr .7s ease both}
svg[role=img]{animation:pop .5s ease both}
#toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cd);border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:12px;max-width:90%;z-index:5;animation:pop .25s ease}
#toast button{background:none;border:0;color:var(--cd);font-weight:700;text-decoration:underline;min-height:32px}
#fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:30px;box-shadow:0 4px 12px #0004;z-index:4}
.chip{display:inline-flex;align-items:center;margin:4px 6px 0 0}
.cf{position:fixed;top:-20px;font-size:22px;animation:fall 2.2s ease-in forwards;z-index:9;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
</style>
</head>
<body>
<div id="app">Cargando…</div>
<nav><div><button data-a="tab" data-v="i">Inicio</button><button data-a="tab" data-v="m">Movimientos</button><button data-a="tab" data-v="d">Deudas</button><button data-a="tab" data-v="a">Ahorros</button><button data-a="tab" data-v="x">Más</button></div></nav><button id="fab" data-a="fab" aria-label="Nuevo movimiento">+</button><div id="toast" role="status"></div><div id="lock" role="dialog" aria-label="Bloqueo"><img id="lgk" alt="PYON" width="96" height="96" style="border-radius:22px"><div style="font-weight:700;font-size:18px">Ingresa tu PIN</div><input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN" style="max-width:220px;text-align:center;font-size:24px"><div id="le" class="d" style="color:var(--rd)"></div><button class="b" data-a="lk" style="min-width:160px">Entrar</button></div>
<script>
if(typeof claude==='undefined'){window.claude={shim:1,use:async n=>n==='downloads'?{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove()}}:null}}
const $=s=>document.querySelector(s),MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const LOGO=document.querySelector('link[rel=icon]').href;
const BANCOS=['BCP','BBVA','Interbank','Scotiabank','BanBif','Banco de la Nación','Mibanco','Banco Pichincha','Banco Falabella','Banco Ripley','Financiera Oh!','Yape','Plin','Efectivo'];
const CATS=['Comida','Transporte','Hogar','Servicios','Salud','Educación','Ocio','Compras','Suscripciones','Pareja y familia','Otros'];
const COL=['#1F6F5C','#D9962B','#3B6EA8','#8E5BA6','#A63A28','#5B6862','#2E8B9A','#B8710F'];
const KN={d:'débito',c:'crédito',b:'billetera',e:'efectivo'},TN={g:'Gasto',i:'Ingreso',p:'Pago tarjeta',a:'Ahorro'};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fm=n=>'S/ '+(+n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let C={medios:[],cats:CATS.map(n=>({n})),deudas:[],metas:[],years:[],frec:[],rec:[],notas:[],pres:{},nombre:'',tc:0,pin:null},M={},tab='i',sub='',ym=today().slice(0,7),yr=today().slice(0,4),fT='g',ed=null,undo=null,db=null,uid=null,msg='',tm,pend=new Set();
const pen=x=>x.cur==='USD'?x.mo*(+x.tc||+C.tc||0):x.mo;
const all=()=>Object.values(M).flat(),inM=p=>all().filter(x=>x.f.startsWith(p)),sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):pen(x)),0);
const CE={Comida:'🍽️',Transporte:'🚌',Hogar:'🏠',Servicios:'💡',Salud:'💊','Educación':'📚',Ocio:'🎬',Compras:'🛍️',Suscripciones:'📺','Pareja y familia':'💞',Otros:'🧩'},ce=c=>CE[c]||'🏷️',KE={d:'🏦',c:'💳',b:'📱',e:'💵'};
const calm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches,prevYm=()=>{let y=+ym.slice(0,4),m=+ym.slice(5)-1;if(m<1){m=12;y--}return y+'-'+String(m).padStart(2,'0')};
let tt;function toast(t,lab,fn){const e=$('#toast');e.innerHTML=esc(t)+(lab?`<button data-a="tu">${lab}</button>`:'');e.style.display='flex';undo=fn||null;clearTimeout(tt);tt=setTimeout(()=>{e.style.display='none';undo=null},5000)}
function confeti(){if(calm())return;for(let i=0;i<26;i++){const s=document.createElement('span');s.className='cf';s.textContent=['🎉','✨','🐰','💚'][i%4];s.style.left=Math.random()*95+'%';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
function conteo(){if(calm())return;document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now(),f=t=>{const q=Math.min(1,(t-t0)/700);e.textContent=fm(n*q);if(q<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function saludo(){const h=new Date().getHours(),g=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><img src="${LOGO}" width="44" height="44" alt="PYON" style="border-radius:12px"><b style="font-size:20px;letter-spacing:.06em">PYON</b></div>`+(C.nombre?`<div style="font-size:20px;font-weight:700;margin-bottom:8px">${g}, ${esc(C.nombre)} 🐰</div>`:`<div class="c"><div class="k">¿Cómo te llamas?</div><div class="r" style="margin-top:6px"><input id="nm" placeholder="Tu nombre"><button class="b" data-a="nm">Guardar</button></div></div>`)}
function vPres(g){const L=C.cats.filter(c=>+C.pres[c.n]>0);if(!L.length)return'';return `<div class="c"><div class="k">Presupuestos del mes</div>`+L.map(c=>{const s=sum(g.filter(x=>x.c===c.n)),l=+C.pres[c.n],q=Math.round(s/l*100);return `<div class="m" style="grid-template-columns:110px 1fr 44px"><span>${ce(c.n)} ${esc(c.n)}</span><div class="t"><div class="f" style="width:${Math.min(100,q)}%;background:${q>=100?'var(--rd)':q>=80?'#D9962B':'var(--ac)'}"></div></div><b>${q} %</b></div><div class="d">${fm(s)} de ${fm(l)}${q>=100?' · ¡te pasaste!':q>=80?' · cerca del límite':''}</div>`}).join('')+`</div>`}
function vRec(){const f=C.rec.filter(r=>!inM(ym).some(x=>x.rid===r.id));if(!f.length)return'';return `<div class="c"><div class="k">Recurrentes por registrar</div>`+f.map(r=>`<div class="r" style="margin-top:8px"><span>${ce(r.c)} ${esc(r.n)} <span class="d">día ${esc(r.dia)}</span></span><span><b>${fm(r.mo)}</b> <button class="o" data-a="rr" data-v="${r.id}">Registrar</button></span></div>`).join('')+`</div>`}
function ics(){const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate()),L=[];
 C.medios.filter(m=>m.k==='c'&&+m.pag&&!m.x).forEach(m=>{let d=new Date(t.getFullYear(),t.getMonth(),+m.pag);if(d<t0)d=new Date(t.getFullYear(),t.getMonth()+1,+m.pag);L.push([d,'pago de tarjeta '+m.n])});
 C.deudas.filter(d=>d.dir==='p'&&!d.ok&&d.v).forEach(d=>L.push([new Date(d.v+'T00:00'),'pago a '+d.n]));C.notas.filter(n=>!n.ok&&n.f).forEach(n=>L.push([new Date(n.f+'T00:00'),n.t]));
 const p=n=>String(n).padStart(2,'0'),z=(d,h)=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+h,st=t.toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';let E=[],k=0;
 L.forEach(([d,n])=>[10,5,3,1].forEach(o=>{const s=new Date(d.getFullYear(),d.getMonth(),d.getDate()-o,9);if(s<t)return;E.push('BEGIN:VEVENT','UID:fin-'+(k++)+'-'+Date.now()+'@mis-finanzas','DTSTAMP:'+st,'DTSTART:'+z(s,'090000'),'DTEND:'+z(s,'091500'),'SUMMARY:Faltan '+o+(o===1?' día':' días')+': '+n,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Recordatorio','TRIGGER:PT0M','END:VALARM','END:VEVENT')}));
 return E.length?'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//PYON//ES\r\n'+E.join('\r\n')+'\r\nEND:VCALENDAR':''}
async function calendario(){const x=ics();if(!x){msg='No hay pagos con fecha futura. Agrega el día de pago a tus tarjetas o fechas a tus deudas y notas.';return render()}
 try{const d=await claude.use('downloads');if(d){await d.save({filename:'recordatorios.ics',data:x});toast('Abre el archivo para agregarlo a tu calendario')}}catch(e){}}
const med=id=>C.medios.find(m=>m.id===id),mn=id=>{const m=med(id);return m?m.n+' ('+KN[m.k]+')':''};
async function init(){try{const u=await claude.use('user');uid=u?await u.id():null;db=uid?await claude.use('db'):null}catch(e){db=null}
 if(!db&&!claude.shim)msg='Modo local: los datos se guardan solo en este dispositivo.';await load();render();lock()}
async function load(){if(db){try{const g=async p=>{const s=await db.doc('data/users/'+uid+'/'+p).get();return s.exists?(typeof s.data==='function'?s.data():s.data):null};
 const c=await g('config');if(c)C=Object.assign(C,c);M={};for(const y of C.years){const d=await g('mov'+y);M[y]=d&&d.list?d.list:[]}return}catch(e){msg='No se pudo leer la nube; se usan datos locales.';db=null}}
 try{const j=JSON.parse(localStorage.getItem('fin1')||'null');if(j){C=Object.assign(C,j.C);M=j.M||{}}}catch(e){}}
function save(k){pend.add(k);clearTimeout(tm);tm=setTimeout(flush,300)}
async function flush(){const p=[...pend];pend.clear();if(db){try{for(const k of p){await db.doc('data/users/'+uid+'/'+(k==='cfg'?'config':'mov'+k)).set(k==='cfg'?C:{list:M[k]||[]})}}catch(e){msg='Error al guardar en la nube. Reintenta.';render()}}else{try{localStorage.setItem('fin1',JSON.stringify({C,M}))}catch(e){}}}
function addMov(o){const y=o.f.slice(0,4);(M[y]=M[y]||[]).push(Object.assign({id:nid()},o));if(!C.years.includes(y)){C.years.push(y);C.years.sort();save('cfg')}save(y)}
function shift(d){let y=+ym.slice(0,4),m=+ym.slice(5)+d;if(m<1){m=12;y--}if(m>12){m=1;y++}ym=y+'-'+String(m).padStart(2,'0')}
const mSel=()=>`<div class="r"><button class="o ic" data-a="mp" aria-label="Mes anterior">‹</button><b>${MN[+ym.slice(5)-1]} ${ym.slice(0,4)}</b><button class="o ic" data-a="mn" aria-label="Mes siguiente">›</button></div>`;
function catSums(g){const o={};g.forEach(x=>o[x.c||'Otros']=(o[x.c||'Otros']||0)+pen(x));let a=Object.entries(o).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);if(a.length>8){const r=a.slice(7);a=a.slice(0,7).concat([{n:'Otras',v:sum(r,x=>x.v)}])}return a}
function donut(it,tot,ctr){const L=2*Math.PI*60;let off=0;const cs=it.map((x,i)=>{const l=x.v/tot*L,s=`<circle cx="80" cy="80" r="60" stroke="${COL[i%8]}" stroke-dasharray="${l.toFixed(2)} ${(L-l).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;off+=l;return s}).join('');
 return `<div style="display:flex;gap:12px;align-items:center"><svg viewBox="0 0 160 160" width="130" height="130" role="img" aria-label="Porcentajes por categoría" style="flex:none"><g fill="none" stroke-width="22" transform="rotate(-90 80 80)">${cs}</g><text x="80" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${ctr}</text></svg><div style="flex:1;display:flex;flex-direction:column;gap:5px">${it.map((x,i)=>`<div class="r" style="font-size:13px"><span><i class="sw" style="background:${COL[i%8]}"></i>${ce(x.n)} ${esc(x.n)}</span><b>${Math.round(x.v/tot*100)} %</b></div>`).join('')}</div></div>`}
function bars(it,tot){return it.map(x=>`<div class="m"><span>${esc(x.n)}</span><div class="t"><div class="f" style="width:${Math.round(x.v/tot*100)}%"></div></div><b>${Math.round(x.v/tot*100)} %</b></div>`).join('')}
function proximo(){const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate()),L=[];
 C.medios.filter(m=>m.k==='c'&&+m.pag&&!m.x).forEach(m=>{let d=new Date(t.getFullYear(),t.getMonth(),+m.pag);if(d<t0)d=new Date(t.getFullYear(),t.getMonth()+1,+m.pag);L.push([d,'Pago de '+m.n])});
 C.deudas.filter(d=>d.dir==='p'&&!d.ok&&d.v).forEach(d=>L.push([new Date(d.v+'T00:00'),'Pagar a '+d.n]));
 const f=L.map(([d,n])=>[Math.round((d-t0)/864e5),n]).filter(x=>x[0]>=0).sort((a,b)=>a[0]-b[0])[0];return f?`Próximo pago: <b>${esc(f[1])}</b> · ${f[0]===0?'hoy':'en '+f[0]+(f[0]===1?' día':' días')}`:''}
function vInicio(){const a=inM(ym),g=a.filter(x=>x.t==='g'),ing=sum(a.filter(x=>x.t==='i')),gas=sum(g),aho=sum(a.filter(x=>x.t==='a'));
 let h=saludo()+mSel()+`<div class="c" style="margin-top:10px"><div class="k">Gasto total del mes</div><div class="big" data-n="${gas}">${fm(gas)}</div><div class="r" style="margin-top:8px"><span>Ingresos<br><b>${fm(ing)}</b></span><span>Ahorrado<br><b>${fm(aho)}</b></span><span style="text-align:right">Saldo<br><b style="color:var(--ac)">${fm(ing-gas-aho)}</b></span></div></div>`;
 const nx=proximo();if(nx)h+=`<div class="c w">${nx}<div style="margin-top:6px"><button class="o" data-a="ics">📅 Agregar recordatorios al calendario</button></div></div>`;
 const pg=sum(inM(prevYm()).filter(x=>x.t==='g'));if(pg>0&&gas>0)h+=`<div class="c d">📊 Este mes llevas ${Math.abs(Math.round((gas-pg)/pg*100))} % ${gas<=pg?'menos':'más'} gastado que en el mes anterior.</div>`;
 h+=vRec()+vPres(g);
 if(!C.medios.length)h+=`<div class="c">Para empezar, agrega tus bancos, tarjetas y billeteras en <b>Más → Medios de pago</b>.</div>`;
 const ms=C.medios.filter(m=>!m.x||g.some(x=>x.m===m.id)),cr=ms.filter(m=>m.k==='c'),ot=ms.filter(m=>m.k!=='c');
 if(cr.length)h+=`<div class="c"><div class="k">Tarjetas de crédito</div>`+cr.map(m=>{const deb=sum(all().filter(x=>x.m===m.id&&x.t==='g'))-sum(all().filter(x=>x.m===m.id&&x.t==='p'));return `<div style="margin-top:10px"><div class="r"><span>${esc(m.n)}</span><b>${fm(sum(g.filter(x=>x.m===m.id)))}</b></div><div class="d">Cierre día ${esc(m.cie||'—')} · Pago día ${esc(m.pag||'—')} · Pendiente de pagar ${fm(deb)}</div></div>`}).join('')+`<div class="r" style="margin-top:10px;border-top:1px solid var(--ln);padding-top:8px"><span>Total tarjetas</span><b>${fm(sum(g.filter(x=>cr.some(m=>m.id===x.m))))}</b></div></div>`;
 if(ot.length)h+=`<div class="c"><div class="k">Cuentas, billeteras y efectivo</div>`+ot.map(m=>`<div class="r" style="margin-top:8px"><span>${esc(m.n)} <span class="d">${KN[m.k]}</span></span><b>${fm(sum(g.filter(x=>x.m===m.id)))}</b></div>`).join('')+`</div>`;
 const cs=catSums(g);if(cs.length)h+=`<div class="c"><div class="k">Gastos por categoría</div>${donut(cs,gas,fm(gas))}</div>`;
 const dc=sum(C.deudas.filter(d=>d.dir==='c'&&!d.ok),pen),dp=sum(C.deudas.filter(d=>d.dir==='p'&&!d.ok),pen);
 return h+`<div class="r"><div class="c" style="flex:1"><div class="k">Me deben</div><b style="color:var(--ac)">${fm(dc)}</b></div><div class="c" style="flex:1"><div class="k">Debo</div><b style="color:var(--rd)">${fm(dp)}</b></div></div>`}
function vMovs(){const e=ed?all().find(x=>x.id===ed):null;if(e)fT=e.t;
 const ms=C.medios.filter(m=>(!m.x||(e&&e.m===m.id))&&(fT!=='p'||m.k==='c')),cs=C.cats.filter(c=>!c.x||(e&&e.c===c.n));
 let h=mSel()+(C.frec.length&&!e?`<div class="c" style="margin-top:10px"><div class="k">Gastos frecuentes · un toque</div>`+C.frec.map(f=>`<span class="chip"><button class="o" data-a="fq" data-v="${f.id}">${ce(f.c)} ${esc(f.n)} · ${fm(f.mo)}</button><button class="x" data-a="fx" data-v="${f.id}" aria-label="Quitar frecuente">✕</button></span>`).join('')+`</div>`:'')+`<div class="c" style="margin-top:10px"><div class="k">${e?'Editar movimiento':'Nuevo movimiento'}</div><div class="seg">${[['g','Gasto'],['i','Ingreso'],['p','Pago de tarjeta']].map(([k,n])=>`<button class="${fT===k?'on':''}" data-a="tt" data-v="${k}">${n}</button>`).join('')}</div>`;
 if(!ms.length)h+=`<div class="d">${fT==='p'?'Primero agrega una tarjeta de crédito':'Primero agrega un medio de pago'} en Más → Medios de pago.</div></div>`;
 else h+=`<label>Monto<input id="mo" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="${e?e.mo:''}"></label><div class="r" style="gap:8px;align-items:flex-start"><label style="flex:1">Moneda<select id="cu"><option value="PEN">S/ Soles</option><option value="USD"${e&&e.cur==='USD'?' selected':''}>US$ Dólares</option></select></label><label style="flex:1">Tipo de cambio (si es US$)<input id="tc" type="number" inputmode="decimal" step="0.001" min="0" value="${e&&e.tc?e.tc:C.tc||''}"></label></div><label>${fT==='p'?'Tarjeta que pagas':'Medio de pago'}<select id="md">${ms.map(m=>`<option value="${m.id}"${e&&e.m===m.id?' selected':''}>${KE[m.k]} ${esc(m.n)} (${KN[m.k]})</option>`).join('')}</select></label>`+(fT==='g'?`<label>Categoría<select id="ct">${cs.map(c=>`<option value="${esc(c.n)}"${e&&e.c===c.n?' selected':''}>${ce(c.n)} ${esc(c.n)}</option>`).join('')}</select></label><label class="chk"><input type="checkbox" id="im"${e&&e.imp?' checked':''}>Marcar como imprevisto</label>`+(e?'':`<label class="chk" style="color:var(--ink);background:var(--bg)"><input type="checkbox" id="fr">Guardar como gasto frecuente</label>`):'')+`<label>Fecha<input id="fe" type="date" value="${e?e.f:today()}"></label><label>Nota<input id="no" placeholder="Opcional" value="${esc(e?e.n:'')}"></label><div class="r" style="margin-top:12px"><button class="b" data-a="add" style="flex:1">${e?'Guardar cambios':'Guardar'}</button>${e?'<button class="o" data-a="ce">Cancelar</button>':''}</div></div>`;

  else{addMov(o);if(fT==='g'&&$('#fr')&&$('#fr').checked){C.frec.push({id:nid(),n:o.n||o.c,mo,c:o.c,m:o.m,cur:o.cur});save('cfg')}toast('Movimiento guardado ✓')}ym=f.slice(0,7)}
 else if(a==='fq'){const f=C.frec.find(x=>x.id===v);if(f){addMov({t:'g',f:today(),mo:f.mo,m:f.m,c:f.c,n:f.n,cur:f.cur,tc:f.cur?C.tc:0});ym=today().slice(0,7);toast('Registrado: '+f.n+' ✓')}}
 else if(a==='fx'){C.frec=C.frec.filter(x=>x.id!==v);save('cfg')}
 else if(a==='nm'){const n=val('nm');if(n){C.nombre=n;save('cfg')}}
 else if(a==='bk')return backup();
 else if(a==='tcs'){C.tc=+val('tcs')||0;save('cfg');toast('Tipo de cambio guardado ✓')}
 else if(a==='pon')return pinOn();else if(a==='pof')return pinOff();else if(a==='lk')return unlock();
 else if(a==='rr'){const r=C.rec.find(x=>x.id===v);if(r){addMov({t:'g',f:ym+'-'+String(Math.min(+r.dia||1,28)).padStart(2,'0'),mo:r.mo,m:r.m,c:r.c,n:r.n,rid:r.id});toast('Registrado: '+r.n+' ✓')}}
 else if(a==='addr'){const n=val('rn'),mo=+val('rm'),dia=val('rd');if(!n||!(mo>0)||!dia){msg='Escribe nombre, monto y día del mes.';return render()}C.rec.push({id:nid(),n,mo,c:val('rc'),m:val('rmd'),dia});save('cfg')}
 else if(a==='rx'){C.rec=C.rec.filter(x=>x.id!==v);save('cfg')}
 else if(a==='addn'){const t=val('nt');if(!t){msg='Escribe el texto de la nota.';return render()}C.notas.push({id:nid(),t,p:val('np'),mo:+val('nmo')||0,f:val('nf'),ok:0});save('cfg')}
 else if(a==='nh'){const n=C.notas.find(x=>x.id===v);if(n){n.ok=1;save('cfg')}}
 else if(a==='nx'){C.notas=C.notas.filter(x=>x.id!==v);save('cfg')}
 else if(a==='nd'){const n=C.notas.find(x=>x.id===v);if(n&&n.mo>0){C.deudas.push({id:nid(),dir:'c',n:n.p||n.t,mo:n.mo,v:n.f||''});n.ok=1;save('cfg');toast('Pasó a Deudas: me deben ✓')}else msg='Para convertirla, la nota necesita un monto.'}
 else if(a==='ng'){const n=C.notas.find(x=>x.id===v),m=C.medios.find(x=>!x.x);if(n&&n.mo>0&&m){addMov({t:'g',f:today(),mo:n.mo,m:m.id,c:C.cats.some(c=>c.n==='Pareja y familia'&&!c.x)?'Pareja y familia':'Otros',n:n.t});n.ok=1;save('cfg');toast('Registrado como gasto con '+m.n+' ✓')}else msg='Para convertirla, la nota necesita un monto y al menos un medio de pago.'}
 else if(a==='dm'){for(const y in M){const i=M[y].findIndex(x=>x.id===v);if(i>=0){const it=M[y].splice(i,1)[0];save(y);toast('Movimiento eliminado','Deshacer',()=>{M[y].push(it);save(y);render()})}}}
 else if(a==='addd'){const n=val('dn'),mo=+val('dm');if(!n||!(mo>0)){msg='Escribe el nombre y un monto mayor que cero.';return render()}C.deudas.push({id:nid(),dir:fD,n,mo,v:val('dv'),cur:val('dc')==='USD'?'USD':'PEN'});save('cfg')}
 else if(a==='od'){const d=C.deudas.find(x=>x.id===v);if(d){d.ok=d.ok?0:1;save('cfg')}}
 else if(a==='dd'){C.deudas=C.deudas.filter(x=>x.id!==v);save('cfg')}
 else if(a==='addg'){const n=val('gn'),meta=+val('gm');if(!n||!(meta>0)){msg='Escribe el nombre y el monto de la meta.';return render()}C.metas.push({id:nid(),n,meta,fe:val('gf')});save('cfg')}
 else if(a==='ap'){const mo=+val('ap'+v);if(!(mo>0)){msg='Escribe el monto a aportar.';return render()}const mt=C.metas.find(x=>x.id===v),pre=sum(all().filter(x=>x.t==='a'&&x.a===v));addMov({t:'a',f:today(),mo,a:v});ym=today().slice(0,7);msg='Aporte registrado y descontado del saldo.';if(mt&&mt.meta>0&&pre<mt.meta&&pre+mo>=mt.meta){confeti();msg='🎉 ¡Meta alcanzada: '+mt.n+'!'}}
 else if(a==='addm'){let n=val('bn'),k=val('bk');if(!n){msg='Escribe el nombre.';return render()}if(/^(yape|plin)$/i.test(n))k='b';if(/^efectivo$/i.test(n))k='e';C.medios.push({id:nid(),n,k,cie:k==='c'?val('bc'):'',pag:k==='c'?val('bp'):''});save('cfg');msg='Medio de pago agregado.'}
 else if(a==='xm'){const m=med(v);if(m){m.x=m.x?0:1;save('cfg')}}
 else if(a==='addc'){const n=val('cn');if(!n){msg='Escribe el nombre.';return render()}if(!C.cats.some(c=>c.n.toLowerCase()===n.toLowerCase()))C.cats.push({n});save('cfg')}
 else if(a==='xc'){const c=C.cats[+v];if(c){c.x=c.x?0:1;save('cfg')}}
 render()});
let hid=0;document.addEventListener('visibilitychange',async()=>{if(document.hidden){hid=Date.now();return}if(C.pin&&hid&&Date.now()-hid>60000)lock();if(!pend.size&&db){await load();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lp')unlock()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
