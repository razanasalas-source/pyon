<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PYON · v4.4.1 · Tarjetas multibanco</title>
<meta name="theme-color" content="#087F5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PYON">
<meta name="application-name" content="PYON">
<link rel="apple-touch-icon" sizes="180x180" href="./pyon-apple-touch-icon.png">
<link rel="manifest" href="./pyon-v4.4.1.webmanifest">

<style>
:root{--bg:#F4F5F1;--cd:#fff;--ink:#17231F;--mu:#5B6862;--ac:#1F6F5C;--on:#fff;--ln:#E3E6E0;--wb:#FFF1DC;--wt:#8A5200;--rd:#A63A28;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--cd:#1B2420;--ink:#E8EEEA;--mu:#A5B1AA;--ac:#4FB89F;--on:#0B1411;--ln:#2C3832;--wb:#3A2A12;--wt:#F0B35A;--rd:#E58673;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--cd:#1B2420;--ink:#E8EEEA;--mu:#A5B1AA;--ac:#4FB89F;--on:#0B1411;--ln:#2C3832;--wb:#3A2A12;--wt:#F0B35A;--rd:#E58673;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px 14px 100px}
.c{background:var(--cd);border-radius:14px;padding:14px;margin-bottom:10px}
.k{font-size:12px;color:var(--mu);letter-spacing:.04em;text-transform:uppercase}
.d{font-size:12px;color:var(--mu)}
.r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.big{font-size:34px;font-weight:700}
button,select,input{font:inherit;color:inherit}
input,select{width:100%;box-sizing:border-box;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:10px;min-height:44px}
input[type=checkbox]{width:20px;height:20px;min-height:0}
label{display:block;margin-top:8px;font-size:13px;color:var(--mu)}
label.chk{display:flex;gap:10px;align-items:center;min-height:44px;color:var(--wt);background:var(--wb);border-radius:10px;padding:0 12px}
.b{min-height:44px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:600;padding:0 16px}
.o{min-height:44px;border:1px solid var(--ln);border-radius:12px;background:transparent;padding:0 14px}
.ic{min-width:44px;font-size:22px;padding:0}
.row{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;margin-bottom:8px;padding:10px 14px;min-height:56px}
.seg{display:flex;border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin:8px 0}
.seg button{flex:1;min-height:44px;border:0;background:var(--cd)}
.seg .on{background:var(--ink);color:var(--cd)}
.t{height:10px;border-radius:5px;background:var(--ln)}
.f{height:10px;border-radius:5px;background:var(--ac)}
.w{background:var(--wb);color:var(--wt)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.m{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;font-size:13px;margin-top:8px}
.x{color:var(--rd);background:none;border:0;min-width:44px;min-height:44px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);padding:4px 0 env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;margin:0 auto}
nav button{flex:1;min-height:48px;background:none;border:0;color:var(--mu);font-size:13px;padding:0 2px}
nav .on{color:var(--ac);font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(100vh) rotate(540deg);opacity:0}}
.v>.c{animation:in .3s ease both}
.f{transform-origin:left;animation:gr .7s ease both}
svg[role=img]{animation:pop .5s ease both}
#toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cd);border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:12px;max-width:90%;z-index:5;animation:pop .25s ease}
#toast button{background:none;border:0;color:var(--cd);font-weight:700;text-decoration:underline;min-height:32px}
#fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:30px;box-shadow:0 4px 12px #0004;z-index:4}
.chip{display:inline-flex;align-items:center;margin:4px 6px 0 0}
.cf{position:fixed;top:-20px;font-size:22px;animation:fall 2.2s ease-in forwards;z-index:9;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}

/* PYON 3.5.1 — iOS / Safari responsive layout */
*,*::before,*::after{box-sizing:border-box}
html{width:100%;max-width:100%;overflow-x:clip;overflow-y:visible;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{width:100%;max-width:100%;overflow-x:clip;overflow-y:visible}
#app{width:100%;min-width:0;max-width:480px;margin-inline:auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
#app *,#app *::before,#app *::after{max-width:100%}
.c,.r,.seg,.m{min-width:0}
.r{flex-wrap:wrap;align-items:center}
.r>*,.seg>*,.m>*{min-width:0}
.r>span,.r>div,.r>label,.r>strong{overflow-wrap:anywhere}
button,input,select,textarea{max-width:100%;-webkit-appearance:none;appearance:none;border-radius:10px}
input,select,textarea{font-size:16px;min-width:0}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:checkbox}
input[type=radio]{-webkit-appearance:radio;appearance:radio}
button{white-space:normal;overflow-wrap:anywhere;touch-action:manipulation}
.seg{flex-wrap:wrap}
.seg button{min-width:0;flex:1 1 95px}
.m{grid-template-columns:minmax(0,96px) minmax(0,1fr) minmax(0,40px)}
nav{width:100%;max-width:100%;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav div{width:100%;min-width:0}
nav button{min-width:0;overflow-wrap:anywhere;font-size:clamp(10px,2.8vw,13px)}
#toast{width:max-content;max-width:calc(100vw - 24px);overflow-wrap:anywhere}
#lock{width:100%;max-width:100%;min-height:100dvh;overflow-y:auto}
.c img,.c svg,.c canvas{max-width:100%;height:auto}
.c table{max-width:100%;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:390px){#app{padding-left:10px;padding-right:10px}.c{padding:11px}.big{font-size:clamp(25px,7vw,34px)}.r>.b,.r>.o{flex-shrink:1}.m{grid-template-columns:minmax(0,82px) minmax(0,1fr) minmax(0,38px);gap:5px;font-size:12px}}

/* PYON 3.5.2 — ventanas combinadas y accesibles */
body.pyon-dialog-open{overflow-x:clip;overflow-y:visible}
#pyon-overlay{position:fixed;inset:0;z-index:30;background:rgba(8,20,16,.57);display:none;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
#pyon-overlay.open{display:flex}
#pyon-overlay.sheet{align-items:flex-end;padding:0}
.pyon-dialog{width:min(100%,420px);max-height:min(88dvh,720px);overflow:auto;overscroll-behavior:contain;background:var(--cd);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 18px 70px #0004}
.sheet .pyon-dialog{width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:90dvh}
.pyon-dialog h2{font-size:20px;margin:4px 0 8px}
.pyon-dialog p{margin:4px 0 14px;overflow-wrap:anywhere}
.pyon-dialog .pyon-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.pyon-dialog .pyon-actions button{flex:1 1 130px}
.pyon-dialog label{display:block}
.pyon-dialog .pyon-handle{width:40px;height:5px;background:var(--ln);border-radius:8px;margin:-8px auto 14px}
@media(prefers-reduced-motion:no-preference){#pyon-overlay.open .pyon-dialog{animation:in .2s ease-out}}

/* PYON v3.5.3 · Diseño equilibrado: jerarquía visual y lectura progresiva */
:root{--radius-card:18px}
#app{padding:12px 14px calc(100px + env(safe-area-inset-bottom,0px))}
.c{border-radius:var(--radius-card);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,44,32,.035)}
.k{font-size:11px;letter-spacing:.055em;font-weight:750}
.d{line-height:1.42}
.big{font-size:clamp(26px,7vw,34px);letter-spacing:-.04em;line-height:1.16}
.r{min-width:0;gap:10px}
.r>*{min-width:0}
button{cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pyon-hero{background:linear-gradient(135deg,#1f6f5c,#154b40);color:white;padding:18px;border-radius:20px;margin-bottom:12px}
.pyon-hero .k,.pyon-hero .d{color:#d9f1e9}
.pyon-hero .big{font-size:clamp(25px,7.5vw,36px);overflow-wrap:anywhere}
.pyon-mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.pyon-mini{padding:13px;border:1px solid var(--ln);background:var(--cd);border-radius:16px;min-width:0}
.pyon-mini .amount{font-weight:750;font-size:clamp(17px,4.8vw,22px);letter-spacing:-.035em;overflow-wrap:anywhere}
.pyon-mini .k{margin-bottom:7px}
.pyon-summary{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pyon-summary>*{min-width:0}
.pyon-detail{margin-top:9px}
.pyon-detail summary{cursor:pointer;color:var(--ac);font-size:12px;font-weight:700;padding:5px 0}
.pyon-detail p{margin:6px 0}
.pyon-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.pyon-menu button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;text-align:left;width:100%;min-height:91px;padding:13px;border:1px solid var(--ln);border-radius:15px;background:var(--cd);color:var(--ink);font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.pyon-menu .ico{font-size:23px;line-height:1.1}
.pyon-menu .txt{font-size:13px}
.pyon-menu button:active{transform:scale(.99)}
.pyon-section-title{font-weight:800;font-size:15px;margin:16px 2px 9px}
.pyon-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.pyon-shortcuts button{width:100%;min-height:46px}
.pyon-quiet{font-size:12px;color:var(--mu)}
.pyon-compact-card{padding:13px 15px}
.pyon-compact-card .r{flex-wrap:wrap}
.pyon-compact-card .d{overflow-wrap:anywhere}
@media(max-width:360px){#app{padding-left:10px;padding-right:10px}.pyon-menu button{padding:10px;min-height:84px}.pyon-mini{padding:11px}.pyon-shortcuts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.v>.c,.f,svg[role=img]{animation:none!important}}

/* PYON 3.5.4: temas y estilos, sin afectar la información financiera */
html:root[data-pyon-palette="emerald"]{--bg:#F4F9F6;--cd:#FFFFFF;--ink:#173B32;--mu:#58736A;--ac:#087F5B;--on:#FFFFFF;--ln:#DCEAE2;--wb:#FFF1DC;--wt:#8A5200;--rd:#B23C3C;color-scheme:light}
html:root[data-pyon-palette="executive"]{--bg:#F2F5FA;--cd:#FFFFFF;--ink:#142C4E;--mu:#64748B;--ac:#2563A6;--on:#FFFFFF;--ln:#DFE6F1;--wb:#FFF3D7;--wt:#815500;--rd:#B23C3C;color-scheme:light}
html:root[data-pyon-palette="aurora"]{--bg:#F8F5FF;--cd:#FFFFFF;--ink:#30234E;--mu:#706586;--ac:#6941C6;--on:#FFFFFF;--ln:#E8E0F8;--wb:#FFF1DC;--wt:#815500;--rd:#B23C3C;color-scheme:light}
html:root[data-pyon-palette="night"]{--bg:#101827;--cd:#1F2937;--ink:#F3F4F6;--mu:#BBC5D2;--ac:#34D399;--on:#101827;--ln:#394454;--wb:#47371D;--wt:#F4C46A;--rd:#FF9A8C;color-scheme:dark}
html[data-pyon-style="classic"] .c,html[data-pyon-style="classic"] .pyon-mini-card,html[data-pyon-style="classic"] .pyon-menu button,html[data-pyon-style="classic"] .pyon-dialog{border-radius:6px}
html[data-pyon-style="classic"] .pyon-menu{display:flex;flex-direction:column;gap:7px}
html[data-pyon-style="classic"] .pyon-menu button{display:flex;flex-direction:row;justify-content:flex-start;gap:12px;text-align:left}
html[data-pyon-style="classic"] .pyon-menu .ico{font-size:20px}
html[data-pyon-style="compact"] #app{padding:9px 10px 88px}
html[data-pyon-style="compact"] .c{padding:10px;margin-bottom:7px;border-radius:9px}
html[data-pyon-style="compact"] .pyon-menu{gap:6px}
html[data-pyon-style="compact"] .pyon-menu button{padding:8px 5px;border-radius:9px}
html[data-pyon-style="compact"] .pyon-section-title{margin-top:12px;margin-bottom:7px}
html[data-pyon-style="modern"] .c{border-radius:19px;box-shadow:0 3px 15px rgba(0,0,0,.035)}
html[data-pyon-style="modern"] .pyon-menu button{border-radius:17px}
.pyon-appearance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pyon-theme-choice{border:2px solid var(--ln);border-radius:15px;background:var(--cd);color:var(--ink);padding:12px;min-height:92px;text-align:left;cursor:pointer}
.pyon-theme-choice[aria-pressed="true"]{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 17%,transparent)}
.pyon-swatches{display:flex;gap:3px;margin-bottom:9px}
.pyon-swatches i{display:block;height:22px;flex:1;border-radius:5px;border:1px solid #7772}
.pyon-style-choice{display:flex;gap:10px;align-items:center;width:100%;padding:13px;margin:8px 0;text-align:left;border:1px solid var(--ln);border-radius:13px;background:var(--cd);color:var(--ink)}
.pyon-style-choice[aria-pressed="true"]{border:2px solid var(--ac)}
.pyon-preview{border:1px solid var(--ln);background:var(--bg);padding:14px;border-radius:16px;margin-top:12px}
.pyon-preview .c{margin:8px 0}
.pyon-preview .big{font-size:26px}
@media(max-width:360px){.pyon-appearance-grid{gap:6px}.pyon-theme-choice{padding:8px}}


/* v3.5.5: controles visibles de apariencia y precedencia de temas */
html:root[data-pyon-palette]{background:var(--bg)}
html[data-pyon-style="classic"] .c{box-shadow:none;border:1px solid var(--ln)}
html[data-pyon-style="classic"] .b,html[data-pyon-style="classic"] .o,html[data-pyon-style="classic"] input,html[data-pyon-style="classic"] select{border-radius:3px}
html[data-pyon-style="classic"] .pyon-menu{grid-template-columns:1fr}
html[data-pyon-style="classic"] .pyon-menu button{min-height:50px;padding:12px 15px}
html[data-pyon-style="compact"] .c{font-size:13px}
html[data-pyon-style="compact"] .r{gap:4px}
html[data-pyon-style="compact"] .pyon-menu{grid-template-columns:repeat(3,minmax(0,1fr))}
html[data-pyon-style="compact"] .pyon-menu .ico{font-size:19px}
html[data-pyon-style="compact"] .pyon-menu .txt{font-size:11px}
html[data-pyon-style="modern"] .c{border:1px solid color-mix(in srgb,var(--ln) 50%,transparent)}
html[data-pyon-palette="night"] .pyon-theme-choice,html[data-pyon-palette="night"] .pyon-style-choice{background:var(--cd)}

/* v3.5.6 - los cambios de tema son inmediatos; las gráficas siguen la paleta */
.pyon-theme-choice,.pyon-style-choice{transition:none!important}
.pyon-chart-modern{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;align-items:end;min-height:205px;padding-top:10px}
.pyon-chart-modern>div{min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:10px;color:var(--ink)}
.pyon-chart-modern b{font-size:11px;white-space:nowrap}
.pyon-chart-modern span{font-size:10px;overflow-wrap:anywhere}
.pyon-chart-column{height:145px;width:100%;display:flex;align-items:end;background:color-mix(in srgb,var(--ac) 9%,var(--cd));border-radius:11px;overflow:hidden}
.pyon-chart-column i{width:100%;display:block;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 70%,white),var(--ac));border-radius:10px 10px 0 0}
.pyon-chart-classic,.pyon-chart-compact{display:grid;gap:11px;margin:12px 0}
.pyon-chart-row{display:grid;grid-template-columns:90px minmax(0,1fr) 60px;gap:8px;align-items:center;font-size:12px}
.pyon-chart-row b,.pyon-chart-compact b{text-align:right;font-size:12px}
.pyon-chart-track{height:17px;background:var(--ln);overflow:hidden;border-radius:2px}
.pyon-chart-track i{display:block;height:100%;background:var(--ac);border-radius:2px}
.pyon-chart-compact{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pyon-chart-compact>div{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:8px;display:grid;gap:5px;font-size:11px}
.pyon-chart-compact .pyon-chart-track{height:8px;border-radius:8px}
.pyon-chart-compact .pyon-chart-track i{border-radius:8px}
@media(max-width:350px){.pyon-chart-row{grid-template-columns:72px minmax(0,1fr) 52px;gap:4px;font-size:11px}.pyon-chart-modern{gap:4px}}

/* PYON v3.7 — sistema visual compartido */
:root{--shadow-soft:0 8px 28px rgba(13,39,31,.055)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.48}
#app{max-width:520px}
.c{border:1px solid var(--ln);box-shadow:var(--shadow-soft)}
.pyon-section-title{font-weight:800;letter-spacing:-.02em}
.pyon-hero{background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 75%,#142c4e));color:var(--on);padding:20px;border-radius:23px;margin-bottom:14px;box-shadow:0 12px 28px color-mix(in srgb,var(--ac) 22%,transparent)}
.pyon-hero .k,.pyon-hero .d{color:var(--on);opacity:.88}
.pyon-hero .big{font-size:clamp(25px,7vw,35px);letter-spacing:-.05em}
.pyon-hero .pyon-hero-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.pyon-hero .pyon-hero-metric{padding:11px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:13px}
.pyon-hero .pyon-hero-metric b{display:block;font-size:17px;margin-top:3px;overflow-wrap:anywhere}
.pyon-report-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pyon-report-title h3{margin:0;font-size:16px;letter-spacing:-.02em}
.pyon-report-chip{font-size:11px;padding:5px 8px;border-radius:20px;background:var(--bg);color:var(--mu)}
.pyon-legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:10px}
.pyon-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--ac)}
.pyon-legend .out i{background:var(--rd)}
.pyon-year-svg{width:100%;height:auto;overflow:visible}
.pyon-year-svg text{font-family:inherit;fill:var(--mu);font-size:10px}
.pyon-year-svg .in{fill:var(--ac)}
.pyon-year-svg .out{fill:var(--rd)}
.pyon-year-svg .gridline{stroke:var(--ln);stroke-dasharray:3 4}
.pyon-year-svg rect{transition:opacity .18s}
.pyon-year-svg rect:hover{opacity:.72}
.pyon-category-row{padding:10px 0;border-bottom:1px solid var(--ln)}
.pyon-category-row:last-child{border:0}
.pyon-category-row .r{margin-bottom:7px}
.pyon-category-row .t{height:12px;border-radius:12px;background:var(--ln);overflow:hidden}
.pyon-category-row .f{height:100%;border-radius:12px;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#fff))}
.pyon-chart-modern .pyon-chart-column{background:color-mix(in srgb,var(--ac) 10%,var(--cd))}

function pyonValidateBackup(parsed){
 if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw new Error('El archivo no contiene un respaldo válido de PYON.');
 if(parsed.format&&parsed.format!=='PYON-respaldo')throw new Error('El archivo tiene un formato desconocido.');
 if(!parsed.C||typeof parsed.C!=='object'||Array.isArray(parsed.C)||!parsed.M||typeof parsed.M!=='object'||Array.isArray(parsed.M))throw new Error('Faltan las secciones C y M del respaldo.');
 const c=parsed.C,m=parsed.M;
 if(!Array.isArray(c.medios)||!Array.isArray(c.cats))throw new Error('Faltan las listas de cuentas o categorías del respaldo.');
 const arrays=['medios','cats','deudas','metas','years','frec','rec','notas'];
 for(const k of arrays){if(c[k]!==undefined&&!Array.isArray(c[k]))throw new Error('La sección '+k+' no es una lista válida.');}
 for(const k of ['medios','cats','deudas','metas','frec','rec','notas']){
  if((c[k]||[]).some(x=>!x||typeof x!=='object'||Array.isArray(x)))throw new Error('La sección '+k+' contiene registros inválidos.');
 }
 if(c.medios.some(x=>!x.id||typeof x.id!=='string'||!x.n||typeof x.n!=='string'))throw new Error('El respaldo contiene cuentas sin identificador o nombre.');
 if(c.cats.some(x=>typeof x.n!=='string'))throw new Error('El respaldo contiene una categoría inválida.');
 if(c.pres!==undefined&&(typeof c.pres!=='object'||c.pres===null||Array.isArray(c.pres)))throw new Error('El apartado de presupuestos no es válido.');
 const cleanM=Object.create(null);let count=0;
 for(const [y,rows] of Object.entries(m)){
  if(!/^\d{4}$/.test(y)||!Array.isArray(rows))throw new Error('Los movimientos deben estar agrupados por año.');
  if(rows.some(x=>!x||typeof x!=='object'||Array.isArray(x)||typeof x.f!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(x.f)||typeof x.t!=='string'||!Number.isFinite(Number(x.mo))))throw new Error('Existen movimientos con estructura inválida en '+y+'.');
  if(rows.some(x=>x.f.slice(0,4)!==y))throw new Error('Hay movimientos guardados en un año diferente al indicado en su fecha.');
  count+=rows.length;
  if(count>100000)throw new Error('El respaldo supera el límite de 100 000 movimientos; no se modificó nada.');
  cleanM[y]=rows.map(x=>Object.assign({},x));
 }
 const cleanC={
  medios:c.medios.map(x=>({...x})),cats:c.cats.map(x=>({...x})),deudas:(c.deudas||[]).map(x=>({...x})),metas:(c.metas||[]).map(x=>({...x})),
  years:Object.keys(cleanM).sort(),frec:(c.frec||[]).map(x=>({...x})),rec:(c.rec||[]).map(x=>({...x})),notas:(c.notas||[]).map(x=>({...x})),
  pres:JSON.parse(JSON.stringify(c.pres||{})),nombre:typeof c.nombre==='string'?c.nombre:'',tc:Number.isFinite(Number(c.tc))?Number(c.tc):0,
  pin:c.pin&&typeof c.pin==='object'&&typeof c.pin.s==='string'&&typeof c.pin.h==='string'?{s:c.pin.s,h:c.pin.h}:null,
  schemaVersion:4
 };
 cleanC.medios.forEach(ac=>{if(!ac.cur)ac.cur='PEN';if(ac.saldoInicial===undefined)ac.saldoInicial=null;if(!ac.tipoCuenta)ac.tipoCuenta=ac.k||'d';});
 for(const rows of Object.values(cleanM))rows.forEach(x=>{if(!x.cuentaId&&x.m)x.cuentaId=x.m;if(!x.cur)x.cur='PEN';});
 const pref=parsed.preferencias&&typeof parsed.preferencias==='object'?parsed.preferencias:null;
 return {C:cleanC,M:cleanM,preferences:pref,originalVersion:String(parsed.version||parsed.v||'anterior')};
}

async function pyonUndoOperation(opId){

 const rows=all().filter(x=>String(x.opId||'')===String(opId));
 if(!rows.length){toast('La operación ya no está disponible.');return}
 const kinds=new Set(rows.map(x=>x.t));
 const title=kinds.has('p')&&kinds.has('card_out')?'Anular pago de tarjeta':kinds.has('ex_out')||kinds.has('ex_in')?'Anular cambio de moneda':'Anular transferencia';
 const warning=rows.length===2?'Se eliminarán los movimientos de origen y destino juntos.':'Esta operación parece incompleta ('+rows.length+' registro/s). Se eliminarán únicamente los registros que aún existen.';
 if(!await pyonConfirm(warning+' Esta acción solo modifica los registros internos de PYON.',''+title))return;
 const removed=[];
 for(const year of Object.keys(M)){
  const group=M[year];if(!Array.isArray(group))continue;
  for(let i=group.length-1;i>=0;i--){if(String(group[i].opId||'')===String(opId)){removed.push({year,index:i,mov:group.splice(i,1)[0]});save(year)}}
 }
 if(!removed.length){toast('No se encontraron registros para anular.');return}
 render();toast('Operación anulada: '+removed.length+' movimiento(s).','Deshacer',()=>{
  for(const item of removed.sort((a,b)=>a.year.localeCompare(b.year)||a.index-b.index)){
   (M[item.year]=M[item.year]||[]).splice(Math.min(item.index,M[item.year].length),0,item.mov);save(item.year);
  }
  render();toast('Operación restaurada.');

oin('')}</select></label><button class="o pyon-full-button" data-a="retg" data-v="${esc(m.id)}" ${saved>0&&accounts.length?'':'disabled'}>Confirmar retiro de la reserva</button></details><details class="pyon-subdetails"><summary>📋 Historial de aportes (${contrib.length})</summary>${contrib.length?contrib.map(x=>`<div class="pyon-goal-history"><span>${esc(x.f)} · ${esc(med(x.cuentaId||x.m)?.n||'Aporte antiguo sin cuenta')}</span><b>${x.t==='a_return'?'− ':'+ '}${money(x.mo,cur)}</b></div>`).join(''):'<p class="d">Sin aportes todavía.</p>'}</details></div></details></div>`;
 }).join(''):'<div class="c pyon-empty-compact">Aún no tienes metas de ahorro.<p class="d">Pulsa + para crear la primera.</p></div>';
 h+=`<details class="c pyon-subdetails"><summary>ℹ️ Cómo funcionan las metas</summary><p class="d">Los aportes registrados desde una cuenta reducen su saldo disponible estimado; los retiros de reserva lo devuelven. No se consideran gastos ordinarios. Los movimientos anteriores se conservan y los aportes antiguos sin cuenta se identifican en el historial.</p></details>`;
 return h;
}

function pyonAccountDependencies(id){
 // Verificar todas las referencias, también movimientos históricos y estructuras antiguas.
 const movements=all().filter(x=>x && (x.m===id||x.cuentaId===id)).length;
 const recurring=(C.rec||[]).filter(r=>r && (r.m===id||r.cuentaId===id)).length;
 const frequent=(C.frec||[]).filter(r=>r && (r.m===id||r.cuentaId===id)).length;
 const debtPayments=(C.deudas||[]).reduce((n,d)=>n+(Array.isArray(d.pagos)?d.pagos.filter(p=>p && (p.m===id||p.cuentaId===id)).length:0),0);
 const legacyDebtLinks=(C.deudas||[]).filter(d=>d && (d.m===id||d.cuentaId===id)).length;
 const goalLinks=(C.metas||[]).filter(g=>g && (g.m===id||g.cuentaId===id)).length;
 const notes=(C.notas||[]).filter(n=>n && (n.m===id||n.cuentaId===id)).length;
 const total=movements+recurring+frequent+debtPayments+legacyDebtLinks+goalLinks+notes;
 return {movements,recurring,frequent,debtPayments,legacyDebtLinks,goalLinks,notes,total};
}

function pyonCreditBank(m){

 const match=known.find(b=>n.includes(b.toLocaleLowerCase('es-PE')));
 return match||'Otros bancos';
}

  const items=rows.filter(x=>x.t==='g'&&(x.c||'Otros')===key).sort((a,b)=>b.f.localeCompare(a.f)).slice(0,5);
  const total=cats.reduce((v,x)=>v+x[1],0);
  return `<div class="pyon-chart-info" aria-live="polite"><div class="pyon-chart-label">${esc(key)}</div><div class="r"><span>Total anual</span><b>${money(match[1],cur)}</b></div><div class="r"><span>Participación</span><b>${total?(match[1]/total*100).toFixed(1):0}%</b></div><details style="margin-top:8px"><summary>Últimos gastos (${items.length} mostrados)</summary>${items.map(x=>`<div class="r d"><span>${esc(x.f)} · ${esc(x.n||x.c||'Gasto')}</span><span>${money(x.mo,cur)}</span></div>`).join('')||'<p class="d">Sin gastos.</p>'}</details></div>`;
 }

}

function aiTrend(cur){
 const periods=[];let [y,m]=ym.split('-').map(Number);
 for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const r=all().filter(x=>x.f&&x.f.slice(0,7)===key&&reportCur(x)===cur);periods.push({key,inc:r.filter(x=>x.t==='i').reduce((a,x)=>a+(Number(x.mo)||0),0),exp:r.filter(x=>x.t==='g').reduce((a,x)=>a+(Number(x.mo)||0),0),n:r.filter(x=>x.t==='i'||x.t==='g').length})}

function aiScenario(cur){
 const rows=[];let [y,m]=ym.split('-').map(Number);
 for(let i=0;i<6;i++){const d=new Date(y,m-1-i,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const a=all().filter(x=>x.f&&x.f.slice(0,7)===key&&reportCur(x)===cur&&(x.t==='i'||x.t==='g'));if(a.length)rows.push({key,exp:a.filter(x=>x.t==='g').reduce((s,x)=>s+(Number(x.mo)||0),0),inc:a.filter(x=>x.t==='i').reduce((s,x)=>s+(Number(x.mo)||0),0)})}

let pyonForecastCurrency='PEN',pyonForecastWindow=30,pyonForecastReceivables=false;
const PYON_FC_POSITIVE=new Set(['i','tr_in','ex_in','debt_in','a_return']);
const PYON_FC_NEGATIVE=new Set(['g','a','p','tr_out','ex_out','debt_out','card_out']);
function pyonForecastDelta(x){if(PYON_FC_POSITIVE.has(x.t))return +x.mo||0;if(PYON_FC_NEGATIVE.has(x.t))return -(+x.mo||0);return 0}
function pyonForecastAddDays(key,num){const d=pyonLocalDate(key);if(!d)return null;d.setDate(d.getDate()+num);return pyonDateKey(d)}
function pyonForecastDateRange(start,horizon){return [start,pyonForecastAddDays(start,horizon)]}
function pyonForecastData(cur='PEN',asOf=today()){
 const known=['PEN','USD'].includes(cur)?cur:'PEN',last=pyonForecastAddDays(asOf,30);
 const accounts=C.medios.filter(m=>!m.x&&m.k!=='c'&&(m.cur||'PEN')===known),ids=new Set(accounts.map(m=>m.id));
 const ledger=all().filter(x=>ids.has(x.cuentaId||x.m));
 const validAmount=x=>Number.isFinite(Number(x.mo))&&Number(x.mo)>0;
 const undated=ledger.filter(x=>!pyonLocalDate(x.f));
 const base=accounts.reduce((z,m)=>z+(Number(m.saldoInicial)||0),0)+ledger.filter(x=>!pyonLocalDate(x.f)||x.f<=asOf).reduce((z,x)=>z+pyonForecastDelta(x),0);
 const rows=[];const warnings=[];
 const add=(date,label,amount,category,reference='',originalDate='')=>{
  if(!date||date<asOf||date>last||!Number.isFinite(amount)||amount===0)return;
  rows.push({date,label,amount,category,reference,originalDate});
 };
 // Los movimientos de fecha futura ya registrados se proyectan, no se suman al saldo de hoy.
 ledger.filter(x=>pyonLocalDate(x.f)&&x.f>asOf&&x.f<=last&&validAmount(x)).forEach(x=>{
  const delta=pyonForecastDelta(x);
  if(delta) add(x.f,x.n||x.c||pyonMovementLabel(x),delta,'Movimiento registrado',x.id);
 });
 const recurring=C.rec||[];
 for(const r of recurring){
  if((med(r.m)?.cur||r.cur||'PEN')!==known)continue;
  const value=Number(r.mo),day=Number(r.dia);
  if(!(value>0)||!Number.isFinite(value)||!Number.isInteger(day)||day<1||day>31)continue;
  for(let offset=0;offset<=1;offset++){
   const d=pyonLocalDate(asOf),year=d.getFullYear(),month=d.getMonth()+offset;
   const actualDay=Math.min(day,new Date(year,month+1,0).getDate());
   const due=pyonDateKey(new Date(year,month,actualDay));if(due<asOf||due>last)continue;
   const monthKey=due.slice(0,7);
   // Si se registró el recurrente, no se vuelve a presupuestar en ese mes.
   if(all().some(x=>x.rid===r.id&&typeof x.f==='string'&&x.f.startsWith(monthKey)))continue;
   add(due,'Recurrente: '+r.n,-value,'Recurrente',r.id);
  }
 }
 for(const d of C.deudas){
  if((d.cur||'PEN')!==known||d.ok||debtLeft(d)<0.005)continue;
  const owed=d.dir==='p',receivable=d.dir==='c';if(!owed&&!receivable)continue;
  if(!pyonLocalDate(d.v)){
   warnings.push({kind:'debtdate',text:(owed?'Deuda por pagar':'Cobro')+' sin fecha válida: '+d.n});
   continue;
  }
  const due=d.v<asOf?asOf:d.v; // Compromisos vencidos siguen siendo obligaciones pendientes.
  if(due>last)continue;
  add(due,(owed?'Pagar: ':'Cobrar: ')+d.n,(owed?-1:1)*debtLeft(d),owed?'Deuda por pagar':'Cobro posible',d.id,d.v<asOf?d.v:'');
 }
 for(const m of C.medios.filter(x=>x.k==='c'&&!x.x&&(x.cur||'PEN')===known)){
  const day=Number(m.pag);
  if(!Number.isInteger(day)||day<1||day>31){warnings.push({kind:'card',text:'Tarjeta sin día de pago: '+m.n});continue}
  const start=pyonLocalDate(asOf);
  for(let k=0;k<=1;k++){
   const yy=start.getFullYear(),mm=start.getMonth()+k;
   const dt=pyonDateKey(new Date(yy,mm,Math.min(day,new Date(yy,mm+1,0).getDate())));
   if(dt>=asOf&&dt<=last)warnings.push({kind:'card',date:dt,text:'Tarjeta: '+m.n+' · monto no confirmado'});
  }
 }
 if(undated.length)warnings.push({kind:'ledger',text:undated.length+' movimiento(s) sin fecha válida incluidos en el saldo inicial estimado.'});
 const notes=C.notas.filter(n=>!n.ok&&pyonLocalDate(n.f)&&n.f>=asOf&&n.f<=last);
 if(notes.length)warnings.push({kind:'notes',text:notes.length+' nota(s) pendiente(s) no cuantificadas automáticamente.'});
 rows.sort((a,b)=>a.date.localeCompare(b.date)||a.label.localeCompare(b.label));
 const projection=(days,receivables=false)=>{
  const date=pyonForecastAddDays(asOf,days);
  const included=rows.filter(x=>x.date<=date&&(receivables||x.category!=='Cobro posible'));
  const incomes=included.filter(x=>x.amount>0).reduce((z,x)=>z+x.amount,0);
  const outgoing=included.filter(x=>x.amount<0).reduce((z,x)=>z-x.amount,0);
  return {date,balance:base+incomes-outgoing,incomes,outgoing,known:included.length};
 };
 return {cur:known,asOf,base,accounts:accounts.length,rows,warnings,projection};
}

   }

   node.nodeValue=previous;
   pyonPrivacyOriginals.delete(node);
  }
 }
